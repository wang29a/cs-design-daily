name: Publish reading page

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'templates/**'
      - 'assets/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out reading page
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Validate the content pipeline
        run: python3 -m unittest discover -s tests
      - name: Build the reading journal
        run: python3 scripts/build.py --output dist --base-path /cs-design-daily
      - name: Upload generated reading pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
