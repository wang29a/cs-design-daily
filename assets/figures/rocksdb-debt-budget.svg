<svg xmlns="http://www.w3.org/2000/svg" width="560" height="806" viewBox="0 0 560 806" role="img" aria-labelledby="title desc">
<title id="title">缓冲买到时间，减速才能让欠账下降</title><desc id="desc">教学模型：1 MiB 用户更新 → 3 MiB 工作量</desc>
<defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18283b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287467"/></marker>
<marker id="rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a54426"/></marker>
</defs>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif">
<rect x="0" y="0" width="560" height="806" rx="12" fill="#f7f5f0" stroke="none" stroke-width="1.5"/>
<text x="32" y="48" fill="#18283b" font-size="26" font-weight="650" text-anchor="start">缓冲买到时间，减速才能让欠账下降</text>
<text x="32" y="80" fill="#5b6877" font-size="20" font-weight="400" text-anchor="start">教学模型：1 MiB 用户更新 → 3 MiB 工作量</text>
<text x="32" y="124" fill="#18283b" font-size="22" font-weight="400" text-anchor="start">Q：等价工作量 / MiB</text>
<path d="M 82 484 H 510" stroke="#d9dfdc" stroke-width="1" stroke-dasharray="4 5"/>
<text x="67" y="491" fill="#18283b" font-size="21" font-weight="400" text-anchor="end">0</text>
<path d="M 82 424 H 510" stroke="#d9dfdc" stroke-width="1" stroke-dasharray="4 5"/>
<text x="67" y="431" fill="#18283b" font-size="21" font-weight="400" text-anchor="end">20</text>
<path d="M 82 364 H 510" stroke="#d9dfdc" stroke-width="1" stroke-dasharray="4 5"/>
<text x="67" y="371" fill="#18283b" font-size="21" font-weight="400" text-anchor="end">40</text>
<path d="M 82 304 H 510" stroke="#287467" stroke-width="1" stroke-dasharray="4 5"/>
<text x="67" y="311" fill="#18283b" font-size="21" font-weight="400" text-anchor="end">60</text>
<path d="M 82 244 H 510" stroke="#d9dfdc" stroke-width="1" stroke-dasharray="4 5"/>
<text x="67" y="251" fill="#18283b" font-size="21" font-weight="400" text-anchor="end">80</text>
<path d="M 82 184 H 510" stroke="#a54426" stroke-width="1" stroke-dasharray="4 5"/>
<text x="67" y="191" fill="#18283b" font-size="21" font-weight="400" text-anchor="end">100</text>
<path d="M 80 484 L 80 146" fill="none" stroke="#18283b" stroke-width="2.5" marker-end="url(#ink)"/>
<path d="M 80 484 L 526 484" fill="none" stroke="#18283b" stroke-width="2.5" marker-end="url(#ink)"/>
<text x="100" y="518" fill="#18283b" font-size="22" font-weight="400" text-anchor="middle">0</text>
<text x="200" y="518" fill="#18283b" font-size="22" font-weight="400" text-anchor="middle">1</text>
<text x="300" y="518" fill="#18283b" font-size="22" font-weight="400" text-anchor="middle">2</text>
<text x="400" y="518" fill="#18283b" font-size="22" font-weight="400" text-anchor="middle">3</text>
<text x="500" y="518" fill="#18283b" font-size="22" font-weight="400" text-anchor="middle">4</text>
<text x="280" y="558" fill="#18283b" font-size="22" font-weight="400" text-anchor="middle">时间 / 秒（每秒末重新记账）</text>
<polyline points="100,424 200,364 300,304" fill="none" stroke="#18283b" stroke-width="4" stroke-linejoin="round"/>
<circle cx="100" cy="424" r="5" fill="#18283b"/>
<circle cx="200" cy="364" r="5" fill="#18283b"/>
<circle cx="300" cy="304" r="5" fill="#18283b"/>
<polyline points="300,304 400,244 500,184" fill="none" stroke="#a54426" stroke-width="4" stroke-linejoin="round"/>
<circle cx="300" cy="304" r="5" fill="#a54426"/>
<circle cx="400" cy="244" r="5" fill="#a54426"/>
<circle cx="500" cy="184" r="5" fill="#a54426"/>
<polyline points="300,304 400,334 500,364" fill="none" stroke="#287467" stroke-width="4" stroke-linejoin="round"/>
<circle cx="300" cy="304" r="5" fill="#287467"/>
<circle cx="400" cy="334" r="5" fill="#287467"/>
<circle cx="500" cy="364" r="5" fill="#287467"/>
<text x="493" y="173" fill="#a54426" font-size="21" font-weight="400" text-anchor="end">停止线 100</text>
<text x="510" y="293" fill="#287467" font-size="21" font-weight="400" text-anchor="end">减速线 60</text>
<rect x="32" y="590" width="240" height="92" rx="10" fill="#fae9df" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="152.0" y="624" fill="#a54426" font-size="22" font-weight="600" text-anchor="middle">放任：每秒 +20</text>
<text x="152.0" y="655" fill="#5b6877" font-size="20" font-weight="400" text-anchor="middle">r=20：新增60，完成40</text>
<rect x="288" y="590" width="240" height="92" rx="10" fill="#e7f2ed" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="408.0" y="624" fill="#287467" font-size="22" font-weight="600" text-anchor="middle">减速：每秒 −10</text>
<text x="408.0" y="655" fill="#5b6877" font-size="20" font-weight="400" text-anchor="middle">r=10：新增30，完成40</text>
<text x="280" y="723" fill="#18283b" font-size="24" font-weight="400" text-anchor="middle">共同路径 Q：20 → 40 → 60</text>
<text x="280" y="763" fill="#5b6877" font-size="22" font-weight="400" text-anchor="middle">教学恢复线 40；不是 RocksDB 的配置项</text>
</g>
</svg>
