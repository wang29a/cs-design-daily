<svg xmlns="http://www.w3.org/2000/svg" width="560" height="608" viewBox="0 0 560 608" role="img" aria-labelledby="title desc">
<title id="title">缓冲区为空，还不能说明输入结束</title><desc id="desc">普通阻塞管道 · 两个状态只差最后一个写端引用</desc>
<defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18283b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287467"/></marker>
<marker id="rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a54426"/></marker>
</defs>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif">
<rect x="0" y="0" width="560" height="608" rx="12" fill="#f7f5f0" stroke="none" stroke-width="1.5"/>
<text x="32" y="48" fill="#18283b" font-size="26" font-weight="650" text-anchor="start">缓冲区为空，还不能说明输入结束</text>
<text x="32" y="80" fill="#5b6877" font-size="20" font-weight="400" text-anchor="start">普通阻塞管道 · 两个状态只差最后一个写端引用</text>
<rect x="24" y="112" width="512" height="202" rx="10" fill="#fae9df" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="44" y="148" fill="#18283b" font-size="23" font-weight="600" text-anchor="start">① grep 退出，父进程仍保留写端</text>
<rect x="44" y="170" width="232" height="64" rx="10" fill="#fffefb" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="160.0" y="210.0" fill="#18283b" font-size="23" font-weight="600" text-anchor="middle">缓冲区：空</text>
<rect x="294" y="170" width="222" height="64" rx="10" fill="#fffefb" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="405.0" y="210.0" fill="#18283b" font-size="23" font-weight="600" text-anchor="middle">写端引用：1</text>
<text x="280" y="279" fill="#a54426" font-size="24" font-weight="600" text-anchor="middle">wc 的 read 继续等待</text>
<rect x="24" y="364" width="512" height="202" rx="10" fill="#e7f2ed" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="44" y="400" fill="#18283b" font-size="23" font-weight="600" text-anchor="start">② 父进程关闭最后一个写端</text>
<rect x="44" y="422" width="232" height="64" rx="10" fill="#fffefb" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="160.0" y="462.0" fill="#18283b" font-size="23" font-weight="600" text-anchor="middle">缓冲区：空</text>
<rect x="294" y="422" width="222" height="64" rx="10" fill="#fffefb" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="405.0" y="462.0" fill="#18283b" font-size="23" font-weight="600" text-anchor="middle">写端引用：0</text>
<text x="280" y="531" fill="#287467" font-size="24" font-weight="600" text-anchor="middle">read 返回 0 → wc 输出 2</text>
<path d="M 280 320 L 280 352" fill="none" stroke="#18283b" stroke-width="2.5" marker-end="url(#ink)"/>
<text x="280" y="594" fill="#18283b" font-size="21" font-weight="400" text-anchor="middle">EOF 需要：数据读空，并且所有写端都关闭</text>
</g>
</svg>
