<svg xmlns="http://www.w3.org/2000/svg" width="560" height="803" viewBox="0 0 560 803" role="img" aria-labelledby="title desc">
<title id="title">新调用获得新身份，不按内容去重</title><desc id="desc">独立分支 · P0 已有付款 offset 100 · 下一位置 101</desc>
<defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18283b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287467"/></marker>
<marker id="rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a54426"/></marker>
</defs>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif">
<rect x="0" y="0" width="560" height="803" rx="12" fill="#f7f5f0" stroke="none" stroke-width="1.5"/>
<text x="32" y="48" fill="#18283b" font-size="26" font-weight="650" text-anchor="start">新调用获得新身份，不按内容去重</text>
<text x="32" y="80" fill="#5b6877" font-size="20" font-weight="400" text-anchor="start">独立分支 · P0 已有付款 offset 100 · 下一位置 101</text>
<rect x="32" y="112" width="496" height="110" rx="10" fill="#e7f2ed" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="280" y="151" fill="#18283b" font-size="22" font-weight="600" text-anchor="middle">已写入：付款，ID 7 / epoch 0 / 序号 0</text>
<text x="280" y="194" fill="#5b6877" font-size="22" font-weight="400" text-anchor="middle">下面两支互斥，各自从这一状态出发</text>
<path d="M 280 232 L 280 252 L 75 252 L 75 276" fill="none" stroke="#a54426" stroke-width="2.5" marker-end="url(#rust)"/>
<path d="M 280 252 L 510 252 L 510 530 L 489 530" fill="none" stroke="#a54426" stroke-width="2.5" marker-end="url(#rust)"/>
<rect x="32" y="286" width="456" height="146" rx="10" fill="#fae9df" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="49" y="324" fill="#18283b" font-size="24" font-weight="650" text-anchor="start">A · 同一生产者另调 send</text>
<text x="49" y="367" fill="#18283b" font-size="24" font-weight="400" text-anchor="start">ID 7 / epoch 0 / 序号 1</text>
<text x="49" y="409" fill="#a54426" font-size="24" font-weight="400" text-anchor="start">付款再次追加 → offset 101</text>
<rect x="32" y="466" width="456" height="146" rx="10" fill="#fae9df" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="49" y="504" fill="#18283b" font-size="24" font-weight="650" text-anchor="start">B · 重建生产者，获得新 ID 8</text>
<text x="49" y="547" fill="#18283b" font-size="24" font-weight="400" text-anchor="start">ID 8 / epoch 0 / 序号 0</text>
<text x="49" y="589" fill="#a54426" font-size="24" font-weight="400" text-anchor="start">付款再次追加 → offset 101</text>
<text x="280" y="664" fill="#18283b" font-size="23" font-weight="400" text-anchor="middle">两支的 key 与内容都和原付款相同。</text>
<text x="280" y="703" fill="#18283b" font-size="23" font-weight="600" text-anchor="middle">追加身份不同，就不是旧批次的重试。</text>
<path d="M 32 737 H 528" stroke="#d9dfdc"/>
<text x="280" y="774" fill="#18283b" font-size="20" font-weight="400" text-anchor="middle">箭头表示可选分支，不表示 A 后再执行 B。</text>
</g>
</svg>
