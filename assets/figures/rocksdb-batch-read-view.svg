<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1030" viewBox="0 0 560 1030" role="img" aria-labelledby="title desc">
<title id="title">原子写入，还要配合一致的读取视图</title><desc id="desc">教学模型：批次前 (100,40)，批次后 (90,50)</desc>
<defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18283b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287467"/></marker>
<marker id="rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a54426"/></marker>
</defs>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif">
<rect x="0" y="0" width="560" height="1030" rx="12" fill="#f7f5f0" stroke="none" stroke-width="1.5"/>
<text x="32" y="48" fill="#18283b" font-size="26" font-weight="650" text-anchor="start">原子写入，还要配合一致的读取视图</text>
<text x="32" y="80" fill="#5b6877" font-size="20" font-weight="400" text-anchor="start">教学模型：批次前 (100,40)，批次后 (90,50)</text>
<text x="32" y="124" fill="#18283b" font-size="24" font-weight="600" text-anchor="start">① 两次独立 Get：跨了两个时点</text>
<rect x="80" y="148" width="448" height="73" rx="10" fill="#fffefb" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="304.0" y="192.5" fill="#18283b" font-size="24" font-weight="600" text-anchor="middle">Get 甲 → 100（旧视图）</text>
<rect x="80" y="251" width="448" height="73" rx="10" fill="#e7f2ed" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="304.0" y="295.5" fill="#18283b" font-size="24" font-weight="600" text-anchor="middle">完整批次公布 → V = 4</text>
<rect x="80" y="354" width="448" height="73" rx="10" fill="#fffefb" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="304.0" y="398.5" fill="#18283b" font-size="24" font-weight="600" text-anchor="middle">Get 乙 → 50（新视图）</text>
<path d="M 54 165 L 54 408" fill="none" stroke="#a54426" stroke-width="2.5" marker-end="url(#rust)"/>
<text x="280" y="465" fill="#a54426" font-size="23" font-weight="400" text-anchor="middle">拼出 100 + 50 = 150：不是一个视图</text>
<path d="M 32 499 H 528" stroke="#d9dfdc"/>
<text x="32" y="540" fill="#18283b" font-size="24" font-weight="600" text-anchor="start">② 两次 Get 都使用同一个 P2</text>
<rect x="80" y="564" width="448" height="73" rx="10" fill="#fffefb" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="304.0" y="608.5" fill="#18283b" font-size="24" font-weight="600" text-anchor="middle">P2 下 Get 甲 → 100</text>
<rect x="80" y="667" width="448" height="73" rx="10" fill="#e7f2ed" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="304.0" y="711.5" fill="#18283b" font-size="24" font-weight="600" text-anchor="middle">完整批次公布 → V = 4</text>
<rect x="80" y="770" width="448" height="73" rx="10" fill="#fffefb" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="304.0" y="814.5" fill="#18283b" font-size="24" font-weight="600" text-anchor="middle">P2 下 Get 乙 → 40</text>
<path d="M 54 581 L 54 824" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<text x="280" y="882" fill="#287467" font-size="24" font-weight="400" text-anchor="middle">同一旧视图：100 + 40 = 140</text>
<text x="280" y="940" fill="#18283b" font-size="23" font-weight="400" text-anchor="middle">P2 固定在 2，不跟随 V 推进</text>
<text x="280" y="990" fill="#5b6877" font-size="22" font-weight="400" text-anchor="middle">箭头表示调用顺序，不是运行追踪</text>
</g>
</svg>
