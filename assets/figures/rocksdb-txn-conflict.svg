<svg xmlns="http://www.w3.org/2000/svg" width="560" height="940" viewBox="0 0 560 940" role="img" aria-labelledby="title desc">
<title id="title">旧答案仍可读，旧依据未必可提交</title><desc id="desc">实线：推进 · 虚线：T2 保留待提交状态</desc>
<defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18283b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287467"/></marker>
<marker id="rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a54426"/></marker>
</defs>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif">
<rect x="0" y="0" width="560" height="940" rx="12" fill="#f7f5f0" stroke="none" stroke-width="1.5"/>
<text x="32" y="48" fill="#18283b" font-size="26" font-weight="650" text-anchor="start">旧答案仍可读，旧依据未必可提交</text>
<text x="32" y="80" fill="#5b6877" font-size="20" font-weight="400" text-anchor="start">实线：推进 · 虚线：T2 保留待提交状态</text>
<rect x="32" y="112" width="496" height="100" rx="10" fill="#fffefb" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="280.0" y="146" fill="#18283b" font-size="25" font-weight="600" text-anchor="middle">两事务基准 = 2</text>
<text x="280.0" y="177" fill="#5b6877" font-size="20" font-weight="400" text-anchor="middle">甲@1=100，乙@2=40</text>
<rect x="32" y="258" width="232" height="110" rx="10" fill="#e7f2ed" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="148.0" y="292" fill="#287467" font-size="24" font-weight="600" text-anchor="middle">T1：转移 10</text>
<text x="148.0" y="323" fill="#5b6877" font-size="20" font-weight="400" text-anchor="middle">暂存 (90, 50)</text>
<rect x="296" y="258" width="232" height="110" rx="10" fill="#fae9df" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="412.0" y="292" fill="#a54426" font-size="24" font-weight="600" text-anchor="middle">T2：转移 20</text>
<text x="412.0" y="323" fill="#5b6877" font-size="20" font-weight="400" text-anchor="middle">暂存 (80, 60)</text>
<path d="M 148 217 L 148 250" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<path d="M 412 217 L 412 250" fill="none" stroke="#a54426" stroke-width="2.5" marker-end="url(#rust)"/>
<rect x="32" y="414" width="496" height="164" rx="10" fill="#e7f2ed" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="52" y="451" fill="#18283b" font-size="24" font-weight="600" text-anchor="start">① T1 校验通过，完整写入生效</text>
<text x="52" y="496" fill="#287467" font-size="25" font-weight="400" text-anchor="start">甲@3=90，乙@4=50</text>
<text x="52" y="541" fill="#18283b" font-size="24" font-weight="400" text-anchor="start">数据库现在是 (90, 50)</text>
<path d="M 148 374 L 148 407" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<path d="M 412 374 L 544 374 L 544 616 L 412 616 L 412 632" fill="none" stroke="#a54426" stroke-width="2.5" marker-end="url(#rust)" stroke-dasharray="7 5"/>
<rect x="32" y="640" width="496" height="184" rx="10" fill="#fae9df" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="52" y="677" fill="#18283b" font-size="24" font-weight="600" text-anchor="start">② T2 校验：修改已越过基准 2</text>
<text x="52" y="724" fill="#a54426" font-size="25" font-weight="400" text-anchor="start">甲：3 &gt; 2；乙：4 &gt; 2</text>
<text x="52" y="767" fill="#a54426" font-size="24" font-weight="400" text-anchor="start">冲突 Busy → 不写入 (80, 60)</text>
<text x="52" y="803" fill="#18283b" font-size="23" font-weight="400" text-anchor="start">数据库仍为 (90, 50)</text>
<path d="M 280 585 L 280 632" fill="none" stroke="#a54426" stroke-width="2.5" marker-end="url(#rust)"/>
<text x="280" y="869" fill="#18283b" font-size="22" font-weight="400" text-anchor="middle">假设内存修改历史足够，且没有其他错误</text>
<text x="280" y="908" fill="#5b6877" font-size="22" font-weight="400" text-anchor="middle">T2 的旧读取视图与提交校验各有职责</text>
</g>
</svg>
