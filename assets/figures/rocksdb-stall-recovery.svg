<svg xmlns="http://www.w3.org/2000/svg" width="560" height="927" viewBox="0 0 560 927" role="img" aria-labelledby="title desc">
<title id="title">入口可以停，偿还工作不能停</title><desc id="desc">教学模型：后台一秒无推进后，Q 达到 100</desc>
<defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18283b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287467"/></marker>
<marker id="rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a54426"/></marker>
</defs>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif">
<rect x="0" y="0" width="560" height="927" rx="12" fill="#f7f5f0" stroke="none" stroke-width="1.5"/>
<text x="32" y="48" fill="#18283b" font-size="26" font-weight="650" text-anchor="start">入口可以停，偿还工作不能停</text>
<text x="32" y="80" fill="#5b6877" font-size="20" font-weight="400" text-anchor="start">教学模型：后台一秒无推进后，Q 达到 100</text>
<rect x="32" y="116" width="496" height="148" rx="10" fill="#fae9df" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="54" y="151" fill="#18283b" font-size="24" font-weight="600" text-anchor="start">第5→6秒：停止接收</text>
<text x="280" y="197" fill="#a54426" font-size="27" font-weight="600" text-anchor="middle">Q：100 → 60</text>
<text x="280" y="237" fill="#18283b" font-size="22" font-weight="400" text-anchor="middle">r=0，μ=40：只消化积欠</text>
<rect x="32" y="302" width="496" height="148" rx="10" fill="#e7f2ed" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="54" y="337" fill="#18283b" font-size="24" font-weight="600" text-anchor="start">第6→7秒：慢速接收</text>
<text x="280" y="383" fill="#287467" font-size="27" font-weight="600" text-anchor="middle">Q：60 → 50</text>
<text x="280" y="423" fill="#18283b" font-size="22" font-weight="400" text-anchor="middle">r=10，μ=40：新增30，完成40</text>
<rect x="32" y="488" width="496" height="148" rx="10" fill="#e7f2ed" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="54" y="523" fill="#18283b" font-size="24" font-weight="600" text-anchor="start">第7→8秒：慢速接收</text>
<text x="280" y="569" fill="#287467" font-size="27" font-weight="600" text-anchor="middle">Q：50 → 40</text>
<text x="280" y="609" fill="#18283b" font-size="22" font-weight="400" text-anchor="middle">r=10，μ=40：新增30，完成40</text>
<rect x="32" y="674" width="496" height="148" rx="10" fill="#fffefb" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="54" y="709" fill="#18283b" font-size="24" font-weight="600" text-anchor="start">第8→9秒：应用不再提交</text>
<text x="280" y="755" fill="#18283b" font-size="27" font-weight="600" text-anchor="middle">Q：40 → 0</text>
<text x="280" y="795" fill="#18283b" font-size="22" font-weight="400" text-anchor="middle">r=0，μ=40：本轮积欠排空</text>
<path d="M 280 272 L 280 294" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<path d="M 280 458 L 280 480" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<path d="M 280 644 L 280 666" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<text x="280" y="865" fill="#18283b" font-size="22" font-weight="400" text-anchor="middle">Q：MiB 工作量；μ：MiB 工作量/秒</text>
<text x="280" y="904" fill="#5b6877" font-size="22" font-weight="400" text-anchor="middle">r：MiB 用户数据/秒；不计外部排队</text>
</g>
</svg>
