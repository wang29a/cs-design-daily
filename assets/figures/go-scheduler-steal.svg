<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1006" viewBox="0 0 560 1006" role="img" aria-labelledby="title desc">
<title id="title">局部队列留在原地，待办可以转移</title><desc id="desc">教学交错 · GOMAXPROCS=2 · runnext 为空</desc>
<defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18283b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287467"/></marker>
<marker id="rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a54426"/></marker>
</defs>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif">
<rect x="0" y="0" width="560" height="1006" rx="12" fill="#f7f5f0" stroke="none" stroke-width="1.5"/>
<text x="32" y="48" fill="#18283b" font-size="26" font-weight="650" text-anchor="start">局部队列留在原地，待办可以转移</text>
<text x="32" y="80" fill="#5b6877" font-size="20" font-weight="400" text-anchor="start">教学交错 · GOMAXPROCS=2 · runnext 为空</text>
<rect x="32" y="112" width="496" height="328" rx="10" fill="#fffefb" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="48" y="149" fill="#18283b" font-size="24" font-weight="600" text-anchor="start">① 转移前：一边有队列，一边找工作</text>
<rect x="48" y="172" width="464" height="104" rx="10" fill="#fffefb" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="280.0" y="206" fill="#18283b" font-size="25" font-weight="600" text-anchor="middle">M0 + P0：运行 X</text>
<text x="280.0" y="237" fill="#5b6877" font-size="20" font-weight="400" text-anchor="middle">普通队列：A → B → C → D</text>
<rect x="48" y="308" width="464" height="104" rx="10" fill="#fae9df" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="280.0" y="342" fill="#18283b" font-size="25" font-weight="600" text-anchor="middle">M1 + P1：寻找工作</text>
<text x="280.0" y="373" fill="#5b6877" font-size="20" font-weight="400" text-anchor="middle">普通队列：空</text>
<rect x="32" y="578" width="496" height="328" rx="10" fill="#fffefb" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="48" y="615" fill="#18283b" font-size="24" font-weight="600" text-anchor="start">② 转移并开始执行后</text>
<rect x="48" y="638" width="464" height="104" rx="10" fill="#fffefb" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="280.0" y="672" fill="#18283b" font-size="25" font-weight="600" text-anchor="middle">M0 + P0：运行 X</text>
<text x="280.0" y="703" fill="#5b6877" font-size="20" font-weight="400" text-anchor="middle">普通队列：C → D</text>
<rect x="48" y="774" width="464" height="104" rx="10" fill="#e7f2ed" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="280.0" y="808" fill="#18283b" font-size="25" font-weight="600" text-anchor="middle">M1 + P1：运行 B</text>
<text x="280.0" y="839" fill="#5b6877" font-size="20" font-weight="400" text-anchor="middle">普通队列：A</text>
<path d="M 280 457 L 280 500" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<text x="280" y="540" fill="#18283b" font-size="23" font-weight="400" text-anchor="middle">接走 A、B；B 返回给调度器先运行</text>
<path d="M 32 930 H 528" stroke="#d9dfdc"/>
<text x="280" y="967" fill="#18283b" font-size="21" font-weight="400" text-anchor="middle">队列箭头：从头到尾；框间箭头：状态推进</text>
<text x="280" y="996" fill="#5b6877" font-size="21" font-weight="400" text-anchor="middle">转移待运行的 G；正在执行的 X 没有被拆开</text>
</g>
</svg>
