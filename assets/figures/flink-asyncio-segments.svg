<svg xmlns="http://www.w3.org/2000/svg" width="560" height="974" viewBox="0 0 560 974" role="img" aria-labelledby="title desc">
<title id="title">完成了，还得等到自己的段</title><desc id="desc">容量 4 · 请求并发，输出资格按段推进</desc>
<defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18283b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287467"/></marker>
<marker id="rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a54426"/></marker>
</defs>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif">
<rect x="0" y="0" width="560" height="974" rx="12" fill="#f7f5f0" stroke="none" stroke-width="1.5"/>
<text x="32" y="48" fill="#18283b" font-size="26" font-weight="650" text-anchor="start">完成了，还得等到自己的段</text>
<text x="32" y="80" fill="#5b6877" font-size="20" font-weight="400" text-anchor="start">容量 4 · 请求并发，输出资格按段推进</text>
<rect x="32" y="112" width="496" height="100" rx="10" fill="#fffefb" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="280.0" y="146" fill="#18283b" font-size="25" font-weight="600" text-anchor="middle">输入：A → B → W → C</text>
<text x="280.0" y="177" fill="#5b6877" font-size="20" font-weight="400" text-anchor="middle">A:8000,+20 · B:9000,+3 · C:12000,+5</text>
<text x="280" y="259" fill="#18283b" font-size="23" font-weight="400" text-anchor="middle">A、B、C 的三个外部查询均已发起</text>
<rect x="32" y="286" width="496" height="148" rx="10" fill="#fffefb" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="280" y="326" fill="#18283b" font-size="24" font-weight="650" text-anchor="middle">段 1：A、B 均未完成</text>
<text x="280" y="374" fill="#18283b" font-size="23" font-weight="400" text-anchor="middle">本段可乱序，当前还没有结果可输出</text>
<text x="280" y="414" fill="#5b6877" font-size="21" font-weight="400" text-anchor="middle">A、B 的输入条目各占一个位置</text>
<path d="M 280 446 L 280 471" fill="none" stroke="#a54426" stroke-width="2.5" marker-end="url(#rust)"/>
<rect x="32" y="486" width="496" height="112" rx="10" fill="#fae9df" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="280" y="525" fill="#18283b" font-size="24" font-weight="650" text-anchor="middle">段 2：W=9999，条目已完成</text>
<text x="280" y="573" fill="#18283b" font-size="23" font-weight="400" text-anchor="middle">仍要等段 1 的结果全部输出</text>
<path d="M 280 610 L 280 637" fill="none" stroke="#a54426" stroke-width="2.5" marker-end="url(#rust)"/>
<rect x="32" y="652" width="496" height="140" rx="10" fill="#e7f2ed" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="280" y="690" fill="#18283b" font-size="24" font-weight="650" text-anchor="middle">段 3：C′ 查询已完成</text>
<text x="280" y="738" fill="#18283b" font-size="23" font-weight="400" text-anchor="middle">t=12000,+5，先缓存，不跨过 W</text>
<text x="280" y="775" fill="#5b6877" font-size="21" font-weight="400" text-anchor="middle">没有输出，仍然占一个位置</text>
<text x="280" y="845" fill="#18283b" font-size="24" font-weight="600" text-anchor="middle">队列占用：A + B + W + C = 4</text>
<path d="M 32 877 H 528" stroke="#d9dfdc"/>
<text x="280" y="913" fill="#18283b" font-size="20" font-weight="400" text-anchor="middle">箭头：段间输出资格；不是请求串行执行。</text>
<text x="280" y="949" fill="#5b6877" font-size="20" font-weight="400" text-anchor="middle">W 不查外部服务，但也占队列条目。</text>
</g>
</svg>
