<svg xmlns="http://www.w3.org/2000/svg" width="560" height="812" viewBox="0 0 560 812" role="img" aria-labelledby="title desc">
<title id="title">收到错误时，B 还归谁用</title><desc id="desc">R 当前请求 · R2 新请求 · P 查价 · I 库存</desc>
<defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18283b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287467"/></marker>
<marker id="rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a54426"/></marker>
</defs>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif">
<rect x="0" y="0" width="560" height="812" rx="12" fill="#f7f5f0" stroke="none" stroke-width="1.5"/>
<text x="32" y="48" fill="#18283b" font-size="26" font-weight="650" text-anchor="start">收到错误时，B 还归谁用</text>
<text x="32" y="80" fill="#5b6877" font-size="20" font-weight="400" text-anchor="start">R 当前请求 · R2 新请求 · P 查价 · I 库存</text>
<rect x="32" y="112" width="496" height="162" rx="10" fill="#fffefb" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="50" y="160" fill="#18283b" font-size="25" font-weight="650" text-anchor="start">① 库存 I 返回错误 E</text>
<text x="50" y="220" fill="#18283b" font-size="23" font-weight="400" text-anchor="start">R 仍持有 B，查价 P 正在使用</text>
<rect x="32" y="332" width="496" height="162" rx="10" fill="#fae9df" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="50" y="380" fill="#18283b" font-size="25" font-weight="650" text-anchor="start">② 若 R 立刻归还 B</text>
<text x="50" y="440" fill="#18283b" font-size="23" font-weight="400" text-anchor="start">R2 可能借到 B，与 P 重叠访问</text>
<rect x="32" y="552" width="496" height="162" rx="10" fill="#e7f2ed" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="50" y="600" fill="#18283b" font-size="25" font-weight="650" text-anchor="start">安全归还所需的完成条件</text>
<text x="50" y="660" fill="#18283b" font-size="23" font-weight="400" text-anchor="start">P 结束对 B 的最后一次访问并返回</text>
<path d="M 280 285 L 280 320" fill="none" stroke="#a54426" stroke-width="2.5" marker-end="url(#rust)"/>
<path d="M 32 520 H 528" stroke="#d9dfdc"/>
<path d="M 32 747 H 528" stroke="#d9dfdc"/>
<text x="280" y="782" fill="#18283b" font-size="21" font-weight="400" text-anchor="middle">上方是提前归还的反例，下方给出归还条件。</text>
</g>
</svg>
