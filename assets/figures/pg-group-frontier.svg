<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1010" viewBox="0 0 560 1010" role="img" aria-labelledby="title desc">
<title id="title">写出到 240，还不等于持久化到 240</title><desc id="desc">教学位置：KiB · 省略共同基址与实际记录布局</desc>
<defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18283b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287467"/></marker>
<marker id="rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a54426"/></marker>
</defs>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif">
<rect x="0" y="0" width="560" height="1010" rx="12" fill="#f7f5f0" stroke="none" stroke-width="1.5"/>
<text x="32" y="48" fill="#18283b" font-size="26" font-weight="650" text-anchor="start">写出到 240，还不等于持久化到 240</text>
<text x="32" y="80" fill="#5b6877" font-size="20" font-weight="400" text-anchor="start">教学位置：KiB · 省略共同基址与实际记录布局</text>
<rect x="32" y="112" width="496" height="100" rx="10" fill="#fffefb" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="280.0" y="146" fill="#18283b" font-size="24" font-weight="600" text-anchor="middle">提交目标：A=160，B=200，C=240</text>
<text x="280.0" y="177" fill="#5b6877" font-size="20" font-weight="400" text-anchor="middle">目标是提交记录结束位置，不是事务号</text>
<rect x="32" y="260" width="496" height="240" rx="10" fill="#fae9df" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="52" y="303" fill="#18283b" font-size="25" font-weight="600" text-anchor="start">① 已写出：W=240，F=120</text>
<text x="52" y="360" fill="#18283b" font-size="24" font-weight="400" text-anchor="start">日志可能仍在易失缓存里</text>
<text x="52" y="414" fill="#a54426" font-size="25" font-weight="400" text-anchor="start">120 &lt; 160、200、240</text>
<text x="52" y="468" fill="#a54426" font-size="23" font-weight="400" text-anchor="start">三笔的本地持久化义务均未满足</text>
<path d="M 500 508 L 500 566" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<text x="52" y="548" fill="#18283b" font-size="22" font-weight="400" text-anchor="start">完成所选方法要求的同步</text>
<rect x="32" y="574" width="496" height="240" rx="10" fill="#e7f2ed" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="52" y="617" fill="#18283b" font-size="25" font-weight="600" text-anchor="start">② 已可靠刷新：F=240</text>
<text x="52" y="674" fill="#18283b" font-size="23" font-weight="400" text-anchor="start">240 ≥ 160；240 ≥ 200；240 ≥ 240</text>
<text x="52" y="728" fill="#287467" font-size="24" font-weight="400" text-anchor="start">一份连续前缀，覆盖三个目标</text>
<text x="52" y="782" fill="#287467" font-size="23" font-weight="400" text-anchor="start">各自继续完成事务结束与响应</text>
<path d="M 32 857 H 528" stroke="#d9dfdc"/>
<text x="280" y="904" fill="#18283b" font-size="23" font-weight="400" text-anchor="middle">W：写出前沿；F：已持久化前沿</text>
<text x="280" y="957" fill="#5b6877" font-size="22" font-weight="400" text-anchor="middle">假设写出与同步可区分；不是运行追踪</text>
</g>
</svg>
