<svg xmlns="http://www.w3.org/2000/svg" width="560" height="962" viewBox="0 0 560 962" role="img" aria-labelledby="title desc">
<title id="title">重试保留业务意图，重新取得依据</title><desc id="desc">教学时序：无进一步干扰 · 总量始终为 140</desc>
<defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18283b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287467"/></marker>
<marker id="rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a54426"/></marker>
</defs>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif">
<rect x="0" y="0" width="560" height="962" rx="12" fill="#f7f5f0" stroke="none" stroke-width="1.5"/>
<text x="32" y="48" fill="#18283b" font-size="26" font-weight="650" text-anchor="start">重试保留业务意图，重新取得依据</text>
<text x="32" y="80" fill="#5b6877" font-size="20" font-weight="400" text-anchor="start">教学时序：无进一步干扰 · 总量始终为 140</text>
<rect x="32" y="112" width="496" height="136" rx="10" fill="#fae9df" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="52" y="150" fill="#18283b" font-size="24" font-weight="600" text-anchor="start">① 终止失败的 T2 尝试</text>
<text x="52" y="203" fill="#18283b" font-size="22" font-weight="400" text-anchor="start">旧基准 2、旧结果 (80,60) 均不复用</text>
<rect x="32" y="298" width="496" height="136" rx="10" fill="#fffefb" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="52" y="336" fill="#18283b" font-size="24" font-weight="600" text-anchor="start">② 创建 T2′，新基准 = 4</text>
<text x="52" y="389" fill="#18283b" font-size="22" font-weight="400" text-anchor="start">重新读取：甲=90，乙=50</text>
<rect x="32" y="484" width="496" height="136" rx="10" fill="#e7f2ed" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="52" y="522" fill="#18283b" font-size="24" font-weight="600" text-anchor="start">③ 仍要从甲转给乙 20</text>
<text x="52" y="575" fill="#18283b" font-size="22" font-weight="400" text-anchor="start">重新计算：(90−20, 50+20)=(70,70)</text>
<rect x="32" y="670" width="496" height="136" rx="10" fill="#e7f2ed" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="52" y="708" fill="#18283b" font-size="24" font-weight="600" text-anchor="start">④ 新校验通过，完整生效</text>
<text x="52" y="761" fill="#18283b" font-size="22" font-weight="400" text-anchor="start">甲@5=70，乙@6=70 → 两笔均完成</text>
<path d="M 280 256 L 280 287" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<path d="M 280 442 L 280 473" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<path d="M 280 628 L 280 659" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<path d="M 32 840 H 528" stroke="#d9dfdc"/>
<text x="280" y="888" fill="#18283b" font-size="24" font-weight="400" text-anchor="middle">结束条件：T1 成功，T2′ 成功</text>
<text x="280" y="930" fill="#a54426" font-size="22" font-weight="400" text-anchor="middle">反复提交旧结果，不会修复过时计算</text>
</g>
