<svg xmlns="http://www.w3.org/2000/svg" width="560" height="860" viewBox="0 0 560 860" role="img" aria-labelledby="title desc">
<title id="title">同一批修改，需要两种不同表示</title><desc id="desc">教学模型：单数据分组 · WAL 开启 · sync=true</desc>
<defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18283b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287467"/></marker>
<marker id="rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a54426"/></marker>
</defs>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif">
<rect x="0" y="0" width="560" height="860" rx="12" fill="#f7f5f0" stroke="none" stroke-width="1.5"/>
<text x="32" y="48" fill="#18283b" font-size="26" font-weight="650" text-anchor="start">同一批修改，需要两种不同表示</text>
<text x="32" y="80" fill="#5b6877" font-size="20" font-weight="400" text-anchor="start">教学模型：单数据分组 · WAL 开启 · sync=true</text>
<rect x="32" y="112" width="496" height="90" rx="10" fill="#fffefb" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="280.0" y="146" fill="#18283b" font-size="24" font-weight="600" text-anchor="middle">应用：Put / Delete</text>
<text x="280.0" y="177" fill="#5b6877" font-size="20" font-weight="400" text-anchor="middle">修改 a、b、c；需要查询，也需要恢复</text>
<rect x="32" y="258" width="236" height="100" rx="10" fill="#fae9df" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="150.0" y="292" fill="#18283b" font-size="24" font-weight="600" text-anchor="middle">WAL</text>
<text x="150.0" y="323" fill="#5b6877" font-size="20" font-weight="400" text-anchor="middle">按修改顺序记录</text>
<rect x="292" y="258" width="236" height="100" rx="10" fill="#e7f2ed" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="410.0" y="292" fill="#18283b" font-size="24" font-weight="600" text-anchor="middle">memtable</text>
<text x="410.0" y="323" fill="#5b6877" font-size="20" font-weight="400" text-anchor="middle">内存中的有序数据</text>
<path d="M 220 210 L 150 248" fill="none" stroke="#a54426" stroke-width="2.5" marker-end="url(#rust)"/>
<path d="M 340 210 L 410 248" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<text x="150" y="402" fill="#a54426" font-size="21" font-weight="400" text-anchor="middle">恢复依据完成同步</text>
<text x="150" y="434" fill="#5b6877" font-size="20" font-weight="400" text-anchor="middle">成功返回前的必要条件</text>
<rect x="32" y="478" width="496" height="86" rx="10" fill="#e7f2ed" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="280.0" y="512" fill="#18283b" font-size="22" font-weight="600" text-anchor="middle">冻结旧 memtable，启用新的 memtable</text>
<text x="280.0" y="543" fill="#5b6877" font-size="20" font-weight="400" text-anchor="middle">旧批次稳定下来，新修改继续进入内存</text>
<path d="M 410 366 L 410 450 L 280 450 L 280 470" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<rect x="32" y="612" width="496" height="86" rx="10" fill="#fffefb" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="280.0" y="646" fill="#18283b" font-size="22" font-weight="600" text-anchor="middle">刷出：生成 L0 的新 SST 文件</text>
<text x="280.0" y="677" fill="#5b6877" font-size="20" font-weight="400" text-anchor="middle">S1、S2、S3 各自按键有序，写完后保持不变</text>
<path d="M 280 572 L 280 604" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<rect x="32" y="746" width="496" height="78" rx="10" fill="#e7f2ed" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="280.0" y="780" fill="#18283b" font-size="22" font-weight="600" text-anchor="middle">后台合并：重建新的有序文件</text>
<text x="280.0" y="811" fill="#5b6877" font-size="20" font-weight="400" text-anchor="middle">维持读取答案，控制重复版本与候选文件</text>
<path d="M 280 706 L 280 738" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<text x="280" y="847" fill="#5b6877" font-size="20" font-weight="400" text-anchor="middle">箭头表示流向，不表示完整并发调用时序</text>
</g>
</svg>
