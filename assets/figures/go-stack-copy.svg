<svg xmlns="http://www.w3.org/2000/svg" width="560" height="936" viewBox="0 0 560 936" role="img" aria-labelledby="title desc">
<title id="title">栈变大，活动内容仍贴着高端</title><desc id="desc">教学地址 · 4 KiB → 8 KiB · 栈向低地址增长</desc>
<defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18283b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287467"/></marker>
<marker id="rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a54426"/></marker>
</defs>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif">
<rect x="0" y="0" width="560" height="936" rx="12" fill="#f7f5f0" stroke="none" stroke-width="1.5"/>
<text x="32" y="48" fill="#18283b" font-size="26" font-weight="650" text-anchor="start">栈变大，活动内容仍贴着高端</text>
<text x="32" y="80" fill="#5b6877" font-size="20" font-weight="400" text-anchor="start">教学地址 · 4 KiB → 8 KiB · 栈向低地址增长</text>
<rect x="32" y="112" width="496" height="288" rx="10" fill="#fffefb" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="52" y="147" fill="#18283b" font-size="25" font-weight="600" text-anchor="start">① 旧栈：4 KiB</text>
<text x="52" y="185" fill="#18283b" font-size="23" font-weight="400" text-anchor="start">高端 hi = 0x11000</text>
<rect x="48" y="201" width="464" height="62" rx="10" fill="#fae9df" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="280" y="241" fill="#18283b" font-size="23" font-weight="400" text-anchor="middle">活动 1 KiB：复制后内容仍在这里</text>
<text x="52" y="296" fill="#287467" font-size="24" font-weight="600" text-anchor="start">SP = 0x10C00</text>
<text x="52" y="337" fill="#18283b" font-size="23" font-weight="400" text-anchor="start">下面余 3 KiB：新调用装不下</text>
<text x="52" y="379" fill="#18283b" font-size="23" font-weight="400" text-anchor="start">低端 lo = 0x10000</text>
<rect x="32" y="532" width="496" height="288" rx="10" fill="#fffefb" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="52" y="567" fill="#18283b" font-size="25" font-weight="600" text-anchor="start">② 新栈：8 KiB</text>
<text x="52" y="605" fill="#18283b" font-size="23" font-weight="400" text-anchor="start">高端 hi = 0x22000</text>
<rect x="48" y="621" width="464" height="62" rx="10" fill="#e7f2ed" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="280" y="661" fill="#18283b" font-size="23" font-weight="400" text-anchor="middle">活动 1 KiB：复制后内容仍在这里</text>
<text x="52" y="716" fill="#287467" font-size="24" font-weight="600" text-anchor="start">SP = 0x21C00</text>
<text x="52" y="757" fill="#18283b" font-size="23" font-weight="400" text-anchor="start">下面余 7 KiB：可继续本例调用</text>
<text x="52" y="799" fill="#18283b" font-size="23" font-weight="400" text-anchor="start">低端 lo = 0x20000</text>
<path d="M 280 413 L 280 452" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<text x="280" y="486" fill="#18283b" font-size="23" font-weight="400" text-anchor="middle">位移 Δ = new.hi − old.hi = 0x11000</text>
<path d="M 32 845 H 528" stroke="#d9dfdc"/>
<text x="280" y="881" fill="#18283b" font-size="24" font-weight="400" text-anchor="middle">SP 离高端始终为 0x400 字节</text>
<text x="280" y="919" fill="#5b6877" font-size="21" font-weight="400" text-anchor="middle">图不按容量比例绘制；箭头表示状态推进</text>
</g>
</svg>
