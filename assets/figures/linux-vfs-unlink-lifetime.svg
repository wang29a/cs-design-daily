<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1070" viewBox="0 0 560 1070" role="img" aria-labelledby="title desc">
<title id="title">同名新文件，不会接管旧描述符</title><desc id="desc">教学时序 · 向下为时间 · 旧对象无其他持有者</desc>
<defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18283b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287467"/></marker>
<marker id="rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a54426"/></marker>
</defs>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif">
<rect x="0" y="0" width="560" height="1070" rx="12" fill="#f7f5f0" stroke="none" stroke-width="1.5"/>
<text x="32" y="48" fill="#18283b" font-size="26" font-weight="650" text-anchor="start">同名新文件，不会接管旧描述符</text>
<text x="32" y="80" fill="#5b6877" font-size="20" font-weight="400" text-anchor="start">教学时序 · 向下为时间 · 旧对象无其他持有者</text>
<rect x="32" y="112" width="496" height="140" rx="10" fill="#e7f2ed" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="50" y="154" fill="#18283b" font-size="23" font-weight="600" text-anchor="start">① unlink，再创建同名 app.log</text>
<text x="50" y="215" fill="#18283b" font-size="22" font-weight="400" text-anchor="start">新名字 → I23，内容 XYZ；新 fd 6</text>
<rect x="32" y="314" width="496" height="140" rx="10" fill="#fae9df" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="50" y="356" fill="#18283b" font-size="23" font-weight="600" text-anchor="start">② 旧引用仍通往 I17：ABCDEF</text>
<text x="50" y="417" fill="#18283b" font-size="22" font-weight="400" text-anchor="start">3、4 → X，偏移 4；5 → Y，偏移 2</text>
<rect x="32" y="516" width="496" height="140" rx="10" fill="#fffefb" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="50" y="558" fill="#18283b" font-size="23" font-weight="600" text-anchor="start">③ 沿各自对象继续读取</text>
<text x="50" y="596" fill="#18283b" font-size="22" font-weight="400" text-anchor="start">4 读 EF → X 偏移 6</text>
<text x="50" y="634" fill="#18283b" font-size="22" font-weight="400" text-anchor="start">6 读 XYZ → Z 偏移 3</text>
<rect x="32" y="718" width="496" height="140" rx="10" fill="#e7f2ed" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="50" y="760" fill="#18283b" font-size="23" font-weight="600" text-anchor="start">④ 关闭 3、4，仍有 5 引用 Y</text>
<text x="50" y="821" fill="#18283b" font-size="22" font-weight="400" text-anchor="start">再关闭 5 → I17 才满足回收条件</text>
<path d="M 280 263 L 280 301" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<path d="M 280 465 L 280 503" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<path d="M 280 667 L 280 705" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<path d="M 32 902 H 528" stroke="#d9dfdc"/>
<text x="280" y="949" fill="#18283b" font-size="23" font-weight="400" text-anchor="middle">I17 硬链接数为 0，仍可被打开引用持有</text>
<text x="280" y="995" fill="#18283b" font-size="24" font-weight="400" text-anchor="middle">名称、打开引用、偏移：三种不同状态</text>
<text x="280" y="1043" fill="#5b6877" font-size="21" font-weight="400" text-anchor="middle">图中排除其他硬链接、映射与后台持有关系</text>
</g>
</svg>
