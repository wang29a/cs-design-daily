<text x="410.0" y="515" fill="#5b6877" font-size="20" font-weight="400" text-anchor="middle">偏移 = 2</text>
<path d="M 150 440 L 150 366" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
