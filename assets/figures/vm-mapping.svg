<svg xmlns="http://www.w3.org/2000/svg" width="560" height="570" viewBox="0 0 560 570" role="img" aria-labelledby="title desc">
<title id="title">相同虚拟地址，可以指向不同物理页</title><desc id="desc">教学模型：页大小 4096 字节 · 箭头表示地址翻译</desc>
<defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18283b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287467"/></marker>
<marker id="rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a54426"/></marker>
</defs>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif">
<rect x="0" y="0" width="560" height="570" rx="12" fill="#f7f5f0" stroke="none" stroke-width="1.5"/>
<text x="32" y="48" fill="#18283b" font-size="26" font-weight="650" text-anchor="start">相同虚拟地址，可以指向不同物理页</text>
<text x="32" y="80" fill="#5b6877" font-size="20" font-weight="400" text-anchor="start">教学模型：页大小 4096 字节 · 箭头表示地址翻译</text>
<text x="40" y="122" fill="#18283b" font-size="23" font-weight="600" text-anchor="start">编辑器的映射上下文</text>
<rect x="32" y="142" width="212" height="100" rx="10" fill="#fffefb" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="138.0" y="176" fill="#18283b" font-size="21" font-weight="600" text-anchor="middle">虚拟地址 0x1234</text>
<text x="138.0" y="207" fill="#5b6877" font-size="20" font-weight="400" text-anchor="middle">页 1 · 偏移 0x234</text>
<rect x="314" y="142" width="214" height="100" rx="10" fill="#e7f2ed" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="421.0" y="176" fill="#18283b" font-size="20" font-weight="600" text-anchor="middle">物理地址 0x9234</text>
<text x="421.0" y="207" fill="#5b6877" font-size="20" font-weight="400" text-anchor="middle">物理页 9 · 偏移不变</text>
<path d="M 252 191 L 306 191" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<text x="280" y="276" fill="#5b6877" font-size="21" font-weight="400" text-anchor="middle">改的是页号，保留同一个页内偏移</text>
<text x="40" y="312" fill="#18283b" font-size="23" font-weight="600" text-anchor="start">索引器的映射上下文</text>
<rect x="32" y="332" width="212" height="100" rx="10" fill="#fffefb" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="138.0" y="366" fill="#18283b" font-size="21" font-weight="600" text-anchor="middle">虚拟地址 0x1234</text>
<text x="138.0" y="397" fill="#5b6877" font-size="20" font-weight="400" text-anchor="middle">页 1 · 偏移 0x234</text>
<rect x="314" y="332" width="214" height="100" rx="10" fill="#fae9df" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="421.0" y="366" fill="#18283b" font-size="20" font-weight="600" text-anchor="middle">物理地址 0x14234</text>
<text x="421.0" y="397" fill="#5b6877" font-size="20" font-weight="400" text-anchor="middle">物理页 20 · 偏移不变</text>
<path d="M 252 381 L 306 381" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<text x="280" y="466" fill="#5b6877" font-size="21" font-weight="400" text-anchor="middle">改的是页号，保留同一个页内偏移</text>
<path d="M 32 502 H 528" stroke="#d9dfdc"/>
<text x="280" y="541" fill="#18283b" font-size="22" font-weight="400" text-anchor="middle">物理地址 = 物理页号 × 4096 + 0x234</text>
</g>
</svg>
