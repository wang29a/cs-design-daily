<svg xmlns="http://www.w3.org/2000/svg" width="560" height="855" viewBox="0 0 560 855" role="img" aria-labelledby="title desc">
<title id="title">边界相同，交付结果由事务身份决定</title><desc id="desc">两支互斥 · 标记均在 103，且已完成复制</desc>
<defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18283b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287467"/></marker>
<marker id="rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a54426"/></marker>
</defs>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif">
<rect x="0" y="0" width="560" height="855" rx="12" fill="#f7f5f0" stroke="none" stroke-width="1.5"/>
<text x="32" y="48" fill="#18283b" font-size="26" font-weight="650" text-anchor="start">边界相同，交付结果由事务身份决定</text>
<text x="32" y="80" fill="#5b6877" font-size="20" font-weight="400" text-anchor="start">两支互斥 · 标记均在 103，且已完成复制</text>
<rect x="32" y="108" width="496" height="82" rx="10" fill="#fffefb" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="280.0" y="142" fill="#18283b" font-size="24" font-weight="600" text-anchor="middle">从图一选择一个结局</text>
<text x="280.0" y="173" fill="#5b6877" font-size="20" font-weight="400" text-anchor="middle">原布局：100 T / 101 U / 102 T</text>
<path d="M 280 200 L 280 220 L 74 220 L 74 244" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<path d="M 280 220 L 513 220 L 513 527 L 490 527" fill="none" stroke="#a54426" stroke-width="2.5" marker-end="url(#rust)"/>
<rect x="32" y="254" width="456" height="196" rx="10" fill="#e7f2ed" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="49" y="292" fill="#18283b" font-size="24" font-weight="650" text-anchor="start">A · 103 是 COMMIT 标记</text>
<text x="49" y="332" fill="#18283b" font-size="25" font-weight="600" text-anchor="start">HW = LSO = 104</text>
<text x="49" y="372" fill="#287467" font-size="25" font-weight="400" text-anchor="start">交付 100 → 101 → 102</text>
<text x="49" y="414" fill="#5b6877" font-size="22" font-weight="400" text-anchor="start">标记 103 隐藏，下一位置 104</text>
<rect x="32" y="490" width="456" height="196" rx="10" fill="#fae9df" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="49" y="528" fill="#18283b" font-size="24" font-weight="650" text-anchor="start">B · 103 是 ABORT 标记</text>
<text x="49" y="568" fill="#18283b" font-size="25" font-weight="600" text-anchor="start">HW = LSO = 104</text>
<text x="49" y="608" fill="#a54426" font-size="22" font-weight="400" text-anchor="start">过滤 T 的 100、102，只交付 101</text>
<text x="49" y="650" fill="#5b6877" font-size="22" font-weight="400" text-anchor="start">标记 103 隐藏，下一位置 104</text>
<text x="280" y="732" fill="#18283b" font-size="23" font-weight="600" text-anchor="middle">中止不把整段删掉：U 的心跳仍然有效。</text>
<path d="M 32 768 H 528" stroke="#d9dfdc"/>
<text x="280" y="804" fill="#18283b" font-size="20" font-weight="400" text-anchor="middle">箭头表示分支。下一位置按完整扫描后画出。</text>
<text x="280" y="836" fill="#5b6877" font-size="20" font-weight="400" text-anchor="middle">不表示单次 poll 必须返回整个事务。</text>
</g>
</svg>
