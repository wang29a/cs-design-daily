<svg xmlns="http://www.w3.org/2000/svg" width="560" height="890" viewBox="0 0 560 890" role="img" aria-labelledby="title desc">
<title id="title">任务保留状态，线程继续做事</title><desc id="desc">教学模型：GOMAXPROCS=1 · 只画两项业务任务</desc>
<defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18283b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287467"/></marker>
<marker id="rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a54426"/></marker>
</defs>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif">
<rect x="0" y="0" width="560" height="890" rx="12" fill="#f7f5f0" stroke="none" stroke-width="1.5"/>
<text x="32" y="48" fill="#18283b" font-size="26" font-weight="650" text-anchor="start">任务保留状态，线程继续做事</text>
<text x="32" y="80" fill="#5b6877" font-size="20" font-weight="400" text-anchor="start">教学模型：GOMAXPROCS=1 · 只画两项业务任务</text>
<rect x="32" y="112" width="496" height="266" rx="10" fill="#fffefb" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="52" y="151" fill="#18283b" font-size="25" font-weight="600" text-anchor="start">① GA 正在运行</text>
<rect x="48" y="176" width="224" height="104" rx="10" fill="#e7f2ed" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="160.0" y="210" fill="#18283b" font-size="24" font-weight="600" text-anchor="middle">GA：Running</text>
<text x="160.0" y="241" fill="#5b6877" font-size="20" font-weight="400" text-anchor="middle">正在读取连接 A</text>
<rect x="288" y="176" width="224" height="104" rx="10" fill="#fffefb" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="400.0" y="210" fill="#18283b" font-size="24" font-weight="600" text-anchor="middle">GB：Runnable</text>
<text x="400.0" y="241" fill="#5b6877" font-size="20" font-weight="400" text-anchor="middle">输入已齐，等待安排</text>
<text x="280" y="334" fill="#18283b" font-size="23" font-weight="400" text-anchor="middle">M1 持有 P0，当前执行 GA</text>
<rect x="32" y="472" width="496" height="266" rx="10" fill="#fffefb" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="52" y="511" fill="#18283b" font-size="25" font-weight="600" text-anchor="start">② GA 等待，改为推进 GB</text>
<rect x="48" y="536" width="224" height="104" rx="10" fill="#fae9df" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="160.0" y="570" fill="#18283b" font-size="24" font-weight="600" text-anchor="middle">GA：Waiting</text>
<text x="160.0" y="601" fill="#5b6877" font-size="20" font-weight="400" text-anchor="middle">保留栈与等待关系</text>
<rect x="288" y="536" width="224" height="104" rx="10" fill="#e7f2ed" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="400.0" y="570" fill="#18283b" font-size="24" font-weight="600" text-anchor="middle">GB：Running</text>
<text x="400.0" y="601" fill="#5b6877" font-size="20" font-weight="400" text-anchor="middle">计算本地结果 B</text>
<text x="280" y="694" fill="#18283b" font-size="23" font-weight="400" text-anchor="middle">同一个 M1 继续持有 P0，执行 GB</text>
<path d="M 280 390 L 280 426" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<text x="280" y="457" fill="#5b6877" font-size="22" font-weight="400" text-anchor="middle">读取暂无数据，建立等待并挂起 GA</text>
<path d="M 32 778 H 528" stroke="#d9dfdc"/>
<text x="280" y="818" fill="#18283b" font-size="23" font-weight="400" text-anchor="middle">M 是系统线程；P 是运行时调度资源</text>
<text x="280" y="859" fill="#5b6877" font-size="22" font-weight="400" text-anchor="middle">箭头表示状态推进，不是创建新线程</text>
</g>
</svg>
