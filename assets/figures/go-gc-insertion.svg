<text x="150.0" y="315" fill="#5b6877" font-size="20" font-weight="400" text-anchor="middle">next=nil</text>
<rect x="308" y="250" width="204" height="80" rx="10" fill="#fffefb" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="410.0" y="284" fill="#18283b" font-size="24" font-weight="600" text-anchor="middle">C：白</text>
<text x="410.0" y="315" fill="#5b6877" font-size="20" font-weight="400" text-anchor="middle">value=7</text>
<path d="M 410 219 L 410 244" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<text x="280" y="363" fill="#5b6877" font-size="20" font-weight="400" text-anchor="middle">B 由已处理的全局根可达；省略该根</text>
<rect x="32" y="442" width="496" height="268" rx="10" fill="#fffefb" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="48" y="477" fill="#18283b" font-size="24" font-weight="600" text-anchor="start">② 记录新 C，再写入 B.next</text>
<rect x="48" y="496" width="464" height="48" rx="10" fill="#fffefb" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="280.0" y="528.0" fill="#18283b" font-size="23" font-weight="600" text-anchor="middle">未扫 GA 栈：p→C</text>
<rect x="48" y="580" width="204" height="80" rx="10" fill="#e7f2ed" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="150.0" y="614" fill="#18283b" font-size="24" font-weight="600" text-anchor="middle">B：黑</text>
<text x="150.0" y="645" fill="#5b6877" font-size="20" font-weight="400" text-anchor="middle">next→C</text>
<rect x="308" y="580" width="204" height="80" rx="10" fill="#e3e7ec" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="410.0" y="614" fill="#18283b" font-size="24" font-weight="600" text-anchor="middle">C：灰</text>
<text x="410.0" y="645" fill="#5b6877" font-size="20" font-weight="400" text-anchor="middle">value=7</text>
<path d="M 410 549 L 410 574" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<path d="M 258 620 L 302 620" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<text x="280" y="693" fill="#5b6877" font-size="20" font-weight="400" text-anchor="middle">C 已登记，不依赖稍后从 p 再次发现</text>
