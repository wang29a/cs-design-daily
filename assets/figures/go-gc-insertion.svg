<text x="48" y="807" fill="#18283b" font-size="24" font-weight="600" text-anchor="start">③ p 清空，GC 仍完成 C 的扫描</text>
<rect x="48" y="826" width="464" height="48" rx="10" fill="#fffefb" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="280.0" y="858.0" fill="#18283b" font-size="23" font-weight="600" text-anchor="middle">GA 栈：p=nil</text>
<rect x="48" y="910" width="204" height="80" rx="10" fill="#e7f2ed" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="150.0" y="944" fill="#18283b" font-size="24" font-weight="600" text-anchor="middle">B：黑</text>
<text x="150.0" y="975" fill="#5b6877" font-size="20" font-weight="400" text-anchor="middle">next→C</text>
<rect x="308" y="910" width="204" height="80" rx="10" fill="#e7f2ed" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="410.0" y="944" fill="#18283b" font-size="24" font-weight="600" text-anchor="middle">C：黑</text>
<text x="410.0" y="975" fill="#5b6877" font-size="20" font-weight="400" text-anchor="middle">value=7</text>
<path d="M 258 950 L 302 950" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<text x="280" y="1023" fill="#5b6877" font-size="20" font-weight="400" text-anchor="middle">C 已登记，不依赖稍后从 p 再次发现</text>
<path d="M 280 394 L 280 427" fill="none" stroke="#a54426" stroke-width="2.5" marker-end="url(#rust)"/>
<path d="M 280 724 L 280 757" fill="none" stroke="#a54426" stroke-width="2.5" marker-end="url(#rust)"/>
<path d="M 32 1060 H 528" stroke="#d9dfdc"/>
<text x="280" y="1097" fill="#18283b" font-size="22" font-weight="400" text-anchor="middle">白：未发现 · 灰：待扫描 · 黑：已扫描</text>
<text x="280" y="1133" fill="#5b6877" font-size="21" font-weight="400" text-anchor="middle">简化：记录与标记合并；框内箭头为引用</text>
</g>
</svg>
