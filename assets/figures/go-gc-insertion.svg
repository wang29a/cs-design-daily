<text x="280.0" y="198.0" fill="#18283b" font-size="23" font-weight="600" text-anchor="middle">未扫 GA 栈：p→C</text>
<rect x="48" y="250" width="204" height="80" rx="10" fill="#e7f2ed" stroke="#d9dfdc" stroke-width="1.5"/>
