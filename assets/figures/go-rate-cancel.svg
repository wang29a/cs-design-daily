<svg xmlns="http://www.w3.org/2000/svg" width="560" height="674" viewBox="0 0 560 674" role="img" aria-labelledby="title desc">
<title id="title">取消同样一枚，可退的却不同</title><desc id="desc">教学模型 · B 预约 0.5 秒 · C 预约 1 秒</desc>
<defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18283b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287467"/></marker>
<marker id="rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a54426"/></marker>
</defs>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif">
<rect x="0" y="0" width="560" height="674" rx="12" fill="#f7f5f0" stroke="none" stroke-width="1.5"/>
<text x="32" y="48" fill="#18283b" font-size="26" font-weight="650" text-anchor="start">取消同样一枚，可退的却不同</text>
<text x="32" y="80" fill="#5b6877" font-size="20" font-weight="400" text-anchor="start">教学模型 · B 预约 0.5 秒 · C 预约 1 秒</text>
<rect x="32" y="113" width="496" height="106" rx="10" fill="#e7f2ed" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="48" y="149" fill="#18283b" font-size="24" font-weight="650" text-anchor="start">分支一 · 0.25 秒取消 C</text>
<text x="48" y="189" fill="#18283b" font-size="22" font-weight="400" text-anchor="start">推进余额 −1.5，退 1 枚，余额 −0.5</text>
<path d="M 280 225 L 280 253" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<rect x="32" y="260" width="496" height="67" rx="10" fill="#fffefb" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="280" y="302" fill="#18283b" font-size="22" font-weight="600" text-anchor="middle">1 秒时有 1 枚，D 可以立即发送</text>
<rect x="32" y="369" width="496" height="106" rx="10" fill="#fae9df" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="48" y="405" fill="#18283b" font-size="24" font-weight="650" text-anchor="start">分支二 · 0.25 秒取消 B</text>
<text x="48" y="445" fill="#18283b" font-size="22" font-weight="400" text-anchor="start">C 的预约比 B 晚 0.5 秒，只退 0 枚</text>
<path d="M 280 481 L 280 509" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<rect x="32" y="516" width="496" height="67" rx="10" fill="#fffefb" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="280" y="558" fill="#18283b" font-size="22" font-weight="600" text-anchor="middle">1 秒时余额为 0，D 拿不到令牌</text>
<path d="M 32 608 H 528" stroke="#d9dfdc"/>
<text x="280" y="646" fill="#18283b" font-size="21" font-weight="400" text-anchor="middle">两条分支独立，箭头表示各自的时序。</text>
</g>
</svg>
