<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1070" viewBox="0 0 560 1070" role="img" aria-labelledby="title desc">
<title id="title">所有权靠原子操作取得，等待交给内核</title><desc id="desc">教学模型：同进程 A、B · 锁字 L 初始 0，计数 X 初始 0</desc>
<defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18283b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287467"/></marker>
<marker id="rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a54426"/></marker>
</defs>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif">
<rect x="0" y="0" width="560" height="1070" rx="12" fill="#f7f5f0" stroke="none" stroke-width="1.5"/>
<text x="32" y="48" fill="#18283b" font-size="26" font-weight="650" text-anchor="start">所有权靠原子操作取得，等待交给内核</text>
<text x="32" y="80" fill="#5b6877" font-size="20" font-weight="400" text-anchor="start">教学模型：同进程 A、B · 锁字 L 初始 0，计数 X 初始 0</text>
<rect x="32" y="112" width="496" height="140" rx="10" fill="#e7f2ed" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="48" y="147" fill="#18283b" font-size="23" font-weight="600" text-anchor="start">① A：CAS 把 L 从 0 改成 1</text>
<text x="48" y="190" fill="#18283b" font-size="22" font-weight="400" text-anchor="start">成功取得锁；X 目前为 0</text>
<text x="48" y="228" fill="#5b6877" font-size="22" font-weight="400" text-anchor="start">无竞争获取：只需用户态原子操作</text>
<rect x="32" y="282" width="496" height="140" rx="10" fill="#fae9df" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="48" y="317" fill="#18283b" font-size="23" font-weight="600" text-anchor="start">② B：CAS 失败，exchange 1 → 2</text>
<text x="48" y="360" fill="#18283b" font-size="22" font-weight="400" text-anchor="start">A 仍持锁；B 标记竞争后 WAIT(2)</text>
<text x="48" y="398" fill="#5b6877" font-size="22" font-weight="400" text-anchor="start">选定此时序：B 已经入队等待</text>
<rect x="32" y="452" width="496" height="140" rx="10" fill="#fffefb" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="48" y="487" fill="#18283b" font-size="23" font-weight="600" text-anchor="start">③ A：X 加到 1，释放 L：2 → 0</text>
<text x="48" y="530" fill="#18283b" font-size="22" font-weight="400" text-anchor="start">旧值是 2 → 发起 WAKE，最多唤醒 1 人</text>
<text x="48" y="568" fill="#5b6877" font-size="22" font-weight="400" text-anchor="start">B 获得再次竞争的机会，尚未持锁</text>
<rect x="32" y="622" width="496" height="140" rx="10" fill="#e7f2ed" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="48" y="657" fill="#18283b" font-size="23" font-weight="600" text-anchor="start">④ B：exchange 读到 0，写入 2</text>
<text x="48" y="700" fill="#18283b" font-size="22" font-weight="400" text-anchor="start">这次才取得锁；读取 X=1，再加到 2</text>
<text x="48" y="738" fill="#5b6877" font-size="22" font-weight="400" text-anchor="start">保留 2：不丢弃可能仍有的唤醒责任</text>
<rect x="32" y="792" width="496" height="140" rx="10" fill="#e7f2ed" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="48" y="827" fill="#18283b" font-size="23" font-weight="600" text-anchor="start">⑤ B：释放 L：2 → 0，再 WAKE</text>
<text x="48" y="870" fill="#18283b" font-size="22" font-weight="400" text-anchor="start">无其他等待者：唤醒数量可以为 0</text>
<text x="48" y="908" fill="#5b6877" font-size="22" font-weight="400" text-anchor="start">本次结束：L=0，X=2</text>
<path d="M 280 256 L 280 276" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<path d="M 280 426 L 280 446" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<path d="M 280 596 L 280 616" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<path d="M 280 766 L 280 786" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<path d="M 32 962 H 528" stroke="#d9dfdc"/>
<text x="280" y="1003" fill="#5b6877" font-size="22" font-weight="400" text-anchor="middle">箭头表示时间推进，不是实测线程轨迹</text>
<text x="280" y="1040" fill="#287467" font-size="23" font-weight="400" text-anchor="middle">L=2 不是人数，也不等于刚被唤醒者持锁</text>
</g>
</svg>
