<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1170" viewBox="0 0 560 1170" role="img" aria-labelledby="title desc">
<title id="title">通知只恢复资格，读取才取得字节</title><desc id="desc">选定时序 · GOMAXPROCS=1 · 时间自上而下</desc>
<defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18283b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287467"/></marker>
<marker id="rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a54426"/></marker>
</defs>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif">
<rect x="0" y="0" width="560" height="1170" rx="12" fill="#f7f5f0" stroke="none" stroke-width="1.5"/>
<text x="32" y="48" fill="#18283b" font-size="26" font-weight="650" text-anchor="start">通知只恢复资格，读取才取得字节</text>
<text x="32" y="80" fill="#5b6877" font-size="20" font-weight="400" text-anchor="start">选定时序 · GOMAXPROCS=1 · 时间自上而下</text>
<rect x="32" y="112" width="496" height="150" rx="10" fill="#fffefb" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="48" y="147" fill="#18283b" font-size="23" font-weight="600" text-anchor="start">① GA：读取 1 字节，暂无数据</text>
<text x="48" y="193" fill="#18283b" font-size="22" font-weight="400" text-anchor="start">fd 7 的非阻塞 read 得到 EAGAIN</text>
<text x="48" y="236" fill="#5b6877" font-size="22" font-weight="400" text-anchor="start">标准库转入等待，不向业务直接返回它</text>
<rect x="32" y="304" width="496" height="150" rx="10" fill="#e7f2ed" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="48" y="339" fill="#18283b" font-size="23" font-weight="600" text-anchor="start">② GA 等待，M1 + P0 执行 GB</text>
<text x="48" y="385" fill="#18283b" font-size="22" font-weight="400" text-anchor="start">GA 的调用尚未结束，状态仍保留</text>
<text x="48" y="428" fill="#5b6877" font-size="22" font-weight="400" text-anchor="start">GB 有完整输入，可以继续计算</text>
<rect x="32" y="496" width="496" height="150" rx="10" fill="#fae9df" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="48" y="531" fill="#18283b" font-size="23" font-weight="600" text-anchor="start">③ GB 运行期间，fd 7 收到 Q</text>
<text x="48" y="577" fill="#18283b" font-size="22" font-weight="400" text-anchor="start">字节先在内核接收路径中</text>
<text x="48" y="620" fill="#5b6877" font-size="22" font-weight="400" text-anchor="start">没有直接写入 GA 的 Go 缓冲区</text>
<rect x="32" y="688" width="496" height="150" rx="10" fill="#fffefb" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="48" y="723" fill="#18283b" font-size="23" font-weight="600" text-anchor="start">④ GB 完成后，运行时取得就绪</text>
<text x="48" y="769" fill="#18283b" font-size="22" font-weight="400" text-anchor="start">找到等待读取的 GA，转为 Runnable</text>
<text x="48" y="812" fill="#5b6877" font-size="22" font-weight="400" text-anchor="start">这时还未承诺 GA 已经取得字节</text>
<rect x="32" y="880" width="496" height="150" rx="10" fill="#e7f2ed" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="48" y="915" fill="#18283b" font-size="23" font-weight="600" text-anchor="start">⑤ M1 + P0 再执行 GA</text>
<text x="48" y="961" fill="#18283b" font-size="22" font-weight="400" text-anchor="start">重试 read：n=1、err=nil，取得 Q</text>
<text x="48" y="1004" fill="#5b6877" font-size="22" font-weight="400" text-anchor="start">GA 计算结果 A；两项本地工作结束</text>
<path d="M 280 270 L 280 294" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<path d="M 280 462 L 280 486" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<path d="M 280 654 L 280 678" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<path d="M 280 846 L 280 870" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<path d="M 32 1070 H 528" stroke="#d9dfdc"/>
<text x="280" y="1111" fill="#18283b" font-size="25" font-weight="600" text-anchor="middle">可读 ≠ 已调度 ≠ 请求已完成</text>
<text x="280" y="1149" fill="#5b6877" font-size="21" font-weight="400" text-anchor="middle">省略超时、关闭与其他任务；不是运行轨迹</text>
</g>
</svg>
