<svg xmlns="http://www.w3.org/2000/svg" width="560" height="756" viewBox="0 0 560 756" role="img" aria-labelledby="title desc">
<title id="title">新孩子怎样接到取消</title><desc id="desc">L 正从 S 派生，首次检查时 S.Done 仍打开</desc>
<defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18283b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287467"/></marker>
<marker id="rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a54426"/></marker>
</defs>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif">
<rect x="0" y="0" width="560" height="756" rx="12" fill="#f7f5f0" stroke="none" stroke-width="1.5"/>
<text x="32" y="48" fill="#18283b" font-size="26" font-weight="650" text-anchor="start">新孩子怎样接到取消</text>
<text x="32" y="80" fill="#5b6877" font-size="20" font-weight="400" text-anchor="start">L 正从 S 派生，首次检查时 S.Done 仍打开</text>
<rect x="32" y="114" width="496" height="256" rx="10" fill="#e7f2ed" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="50" y="156" fill="#18283b" font-size="24" font-weight="650" text-anchor="start">顺序一：L 先登记</text>
<text x="50" y="211" fill="#18283b" font-size="23" font-weight="400" text-anchor="start">L 持 S 的锁，加入子集合</text>
<path d="M 280 225 L 280 255" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<text x="50" y="294" fill="#18283b" font-size="23" font-weight="400" text-anchor="start">S 随后持锁取消，遍历到 L</text>
<text x="50" y="342" fill="#18283b" font-size="23" font-weight="600" text-anchor="start">结果　L.Done 已关闭</text>
<rect x="32" y="406" width="496" height="256" rx="10" fill="#fae9df" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="50" y="448" fill="#18283b" font-size="24" font-weight="650" text-anchor="start">顺序二：S 先取消</text>
<text x="50" y="503" fill="#18283b" font-size="23" font-weight="400" text-anchor="start">S 持锁写入错误，清空子集合</text>
<path d="M 280 517 L 280 547" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<text x="50" y="586" fill="#18283b" font-size="23" font-weight="400" text-anchor="start">L 随后持锁复查，直接继承取消</text>
<text x="50" y="634" fill="#18283b" font-size="23" font-weight="600" text-anchor="start">结果　L.Done 已关闭</text>
<path d="M 32 691 H 528" stroke="#d9dfdc"/>
<text x="280" y="726" fill="#18283b" font-size="21" font-weight="400" text-anchor="middle">箭头表示先后。两段交错均为教学推演。</text>
</g>
</svg>
