<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1100" viewBox="0 0 560 1100" role="img" aria-labelledby="title desc">
<title id="title">先让未到边界的通道走到边界</title><desc id="desc">教学时序 · 暂停交付不等于丢弃后续记录</desc>
<defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18283b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287467"/></marker>
<marker id="rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a54426"/></marker>
</defs>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif">
<rect x="0" y="0" width="560" height="1100" rx="12" fill="#f7f5f0" stroke="none" stroke-width="1.5"/>
<text x="32" y="48" fill="#18283b" font-size="26" font-weight="650" text-anchor="start">先让未到边界的通道走到边界</text>
<text x="32" y="80" fill="#5b6877" font-size="20" font-weight="400" text-anchor="start">教学时序 · 暂停交付不等于丢弃后续记录</text>
<rect x="32" y="112" width="496" height="154" rx="10" fill="#fae9df" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="49" y="148" fill="#18283b" font-size="24" font-weight="650" text-anchor="start">① P0 的 C8 先到，sum = 30</text>
<text x="49" y="195" fill="#18283b" font-size="22" font-weight="400" text-anchor="start">暂停 P0 后续交付：102 的 5 元先等</text>
<text x="49" y="244" fill="#5b6877" font-size="22" font-weight="400" text-anchor="start">P1 继续处理标记前的记录</text>
<rect x="32" y="324" width="496" height="154" rx="10" fill="#e7f2ed" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="49" y="360" fill="#18283b" font-size="24" font-weight="650" text-anchor="start">② 加入 P1 的 7 元，再收到 C8</text>
<text x="49" y="407" fill="#18283b" font-size="22" font-weight="400" text-anchor="start">sum = 37，两条通道都到达边界</text>
<text x="49" y="456" fill="#5b6877" font-size="22" font-weight="400" text-anchor="start">固定 C8：P0:102 · P1:201 · 总额 37</text>
<rect x="32" y="536" width="496" height="154" rx="10" fill="#fffefb" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="49" y="572" fill="#18283b" font-size="24" font-weight="650" text-anchor="start">③ 同步步骤结束，解除暂停</text>
<text x="49" y="619" fill="#18283b" font-size="22" font-weight="400" text-anchor="start">实时：37 + 5 + 3 = 45</text>
<text x="49" y="668" fill="#5b6877" font-size="22" font-weight="400" text-anchor="start">C8 旧视图仍为 37，后台继续保存</text>
<rect x="32" y="748" width="496" height="154" rx="10" fill="#e7f2ed" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="49" y="784" fill="#18283b" font-size="24" font-weight="650" text-anchor="start">④ C8 完成后故障：配套恢复</text>
<text x="49" y="831" fill="#18283b" font-size="22" font-weight="400" text-anchor="start">恢复 37，重读 P0:102 和 P1:201</text>
<text x="49" y="880" fill="#5b6877" font-size="22" font-weight="400" text-anchor="start">再得 45；下一位置分别为 103、202</text>
<path d="M 280 275 L 280 310" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<path d="M 280 487 L 280 522" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<path d="M 280 699 L 280 734" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<text x="280" y="955" fill="#18283b" font-size="23" font-weight="600" text-anchor="middle">快照承接 10、20、7；重放只补回 5、3。</text>
<text x="280" y="996" fill="#18283b" font-size="22" font-weight="400" text-anchor="middle">本例故障时，C8 是最新完成的检查点。</text>
<path d="M 32 1029 H 528" stroke="#d9dfdc"/>
<text x="280" y="1064" fill="#18283b" font-size="20" font-weight="400" text-anchor="middle">向下箭头表示时间，数字是教学推演。</text>
<text x="280" y="1090" fill="#5b6877" font-size="20" font-weight="400" text-anchor="middle">通道恢复处理可早于整轮可靠保存完成。</text>
</g>
</svg>
