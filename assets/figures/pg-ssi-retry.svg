<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1010" viewBox="0 0 560 1010" role="img" aria-labelledby="title desc">
<title id="title">重做判断，才能得到合法的业务结果</title><desc id="desc">教学结局之一：A 成功，B 失败 · 向下为步骤</desc>
<defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18283b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287467"/></marker>
<marker id="rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a54426"/></marker>
</defs>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif">
<rect x="0" y="0" width="560" height="1010" rx="12" fill="#f7f5f0" stroke="none" stroke-width="1.5"/>
<text x="32" y="48" fill="#18283b" font-size="26" font-weight="650" text-anchor="start">重做判断，才能得到合法的业务结果</text>
<text x="32" y="80" fill="#5b6877" font-size="20" font-weight="400" text-anchor="start">教学结局之一：A 成功，B 失败 · 向下为步骤</text>
<rect x="32" y="112" width="496" height="145" rx="10" fill="#fae9df" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="52" y="152" fill="#18283b" font-size="23" font-weight="600" text-anchor="start">① A 提交：甲离岗，乙仍在岗</text>
<text x="52" y="212" fill="#18283b" font-size="23" font-weight="400" text-anchor="start">B 的旧尝试失败并回滚：40001</text>
<rect x="32" y="318" width="496" height="145" rx="10" fill="#fffefb" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="52" y="358" fill="#18283b" font-size="23" font-weight="600" text-anchor="start">② B′：开始新的 Serializable 事务</text>
<text x="52" y="418" fill="#18283b" font-size="23" font-weight="400" text-anchor="start">重读人数 → 1，放弃旧的批准依据</text>
<rect x="32" y="524" width="496" height="145" rx="10" fill="#e7f2ed" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="52" y="564" fill="#18283b" font-size="23" font-weight="600" text-anchor="start">③ 业务判断：拒绝乙下班</text>
<text x="52" y="624" fill="#18283b" font-size="23" font-weight="400" text-anchor="start">不把乙改成离岗，正常结束事务</text>
<rect x="32" y="730" width="496" height="145" rx="10" fill="#e7f2ed" stroke="#d9dfdc" stroke-width="1.5"/>
<text x="52" y="770" fill="#18283b" font-size="23" font-weight="600" text-anchor="start">④ 最终：甲离岗，乙继续值班</text>
<text x="52" y="830" fill="#18283b" font-size="23" font-weight="400" text-anchor="start">在岗人数 = 1，规则仍成立</text>
<path d="M 280 265 L 280 308" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<path d="M 280 471 L 280 514" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<path d="M 280 677 L 280 720" fill="none" stroke="#287467" stroke-width="2.5" marker-end="url(#teal)"/>
<text x="280" y="928" fill="#18283b" font-size="24" font-weight="400" text-anchor="middle">冲突回滚 ≠ 业务拒绝下班</text>
<text x="280" y="975" fill="#5b6877" font-size="22" font-weight="400" text-anchor="middle">不承诺固定失败者或固定报错时机</text>
</g>
</svg>
