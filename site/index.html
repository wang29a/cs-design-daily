<script id="lesson-data" type="application/json">{"lessons":[{"id":"2026-10-01-unix-pipe","date":"2026-10-01","title":"Unix 管道","subtitle":"怎样让互不认识的程序协作","topic":"操作系统","source":"01-unix-pipe.md","html":"\u003cp>这篇补上 2026 年 10 月 1 日的内容。我们从一个具体需求出发：你做了一个个人知识库，服务产生了一份日志，现在想知道出现了多少行错误。先只统计错误行数，暂时不引入排序，否则会把管道本身和排序算法的行为混在一起。\u003c/p>\n\u003cp>假设日志只有四行：\u003c/p>\n\u003cpre tabindex=\"0\">\u003ccode>INFO opened note\nERROR missing title\nERROR index unavailable\nINFO saved note\u003c/code>\u003c/pre>\n\u003cp>最直观的实现是写一个完整程序：打开文件，逐行读取，判断是否以 ERROR 开头，再增加计数器。这个程序可以正确工作，但明天你想把错误行交给另一个程序分析，后天想改成统计警告，你就得继续扩展它。筛选、统计、输入来源和输出去向，逐渐纠缠起来。\u003c/p>\n\u003cp>也可以把任务拆开：让筛选程序写出一个临时文件，然后让统计程序读取。这样复用了已有工具，却新增了临时文件的命名、清理和生命周期问题。更关键的是，两者之间的协作被表达成“先产生一份完整文件，再消费它”。我们希望表达的其实更简单：前一个程序不断给出结果，后一个程序不断接收结果。\u003c/p>\n\u003cp>Unix 的解决方案需要两块设计同时成立。程序通过标准输入、标准输出使用稳定接口；Shell 能在启动程序时替它们安排这些接口的去向。于是可以写：\u003c/p>\n\u003cpre tabindex=\"0\">\u003ccode>grep &#x27;^ERROR&#x27; app.log | wc -l\u003c/code>\u003c/pre>\n\u003cp>grep 的职责是选择符合条件的行，wc 的职责是统计换行符。两者没有彼此专用的通信代码。这里的关键洞察是：程序不一定要知道自己正在和谁协作，只需要遵守一个足够稳定的输入输出契约。\u003c/p>\n\u003cp>要理解它为什么成立，需要先把“文件描述符”与“文件”分开。文件描述符是一个进程用来访问已打开 I/O 对象的整数编号。编号 0 通常用于标准输入，1 用于标准输出，2 用于标准错误。编号的用途是约定，编号背后连接什么对象则可以调整。因此，向编号 1 写入，并不等于向屏幕写入；也可能向文件或管道写入。这是接口层提供的自由度。\u003ca href=\"https://pdos.csail.mit.edu/6.1810/2025/xv6/book-riscv-rev5.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">MIT《xv6》的文件描述符与管道说明\u003c/a>\u003c/p>\n\u003cp>管道在内核中提供一个缓冲区，以及一个读端和一个写端。pipe(p) 把读端描述符放进 p[0]，写端放进 p[1]。接下来 Shell 创建两个子进程。fork 之后，子进程继承的描述符仍指向同一条管道，数据因此可以跨进程传递。\u003ca href=\"https://man7.org/linux/man-pages/man2/pipe.2.html\" target=\"_blank\" rel=\"noopener noreferrer\">pipe 系统调用手册\u003c/a>\u003c/p>\n\u003cp>我们用教学伪代码压缩这一过程。假设标准输入输出已经打开，p 中的描述符不会碰巧等于 0 或 1，并省略错误处理与等待子进程的代码：\u003c/p>\n\u003cpre tabindex=\"0\">\u003ccode>pipe(p);\n\n// 左边的子进程\ndup2(p[1], 1);\nclose(p[0]);\nclose(p[1]);\nexec_grep();\n\n// 右边的子进程\ndup2(p[0], 0);\nclose(p[0]);\nclose(p[1]);\nexec_wc();\n\n// 父进程启动两边后\nclose(p[0]);\nclose(p[1]);\nwait_for_children();\u003c/code>\u003c/pre>\n\u003cp>dup2(p[1], 1) 并没有把数据复制给编号 1，而是让编号 1 也引用那条管道的写端。随后关闭 p[1]，编号 1 仍然保留这份引用。右边同理，把编号 0 接到读端。这个区别非常重要：重新连接的是描述符与对象之间的关系，程序的筛选和统计逻辑没有改变。\u003ca href=\"https://man7.org/linux/man-pages/man2/dup.2.html\" target=\"_blank\" rel=\"noopener noreferrer\">dup2 系统调用手册\u003c/a>\u003c/p>\n\u003cp>现在沿着一次真实数据流推演。grep 读到第一行 INFO，丢弃它；读到第二行 ERROR，把该行的字节写入标准输出。由于标准输出已经接到管道，这些字节进入内核缓冲区。wc 从自己的标准输入读到字节，发现一个换行符，计数加一。第三行让计数变成二，第四行被 grep 丢弃。最终 grep 结束，wc 输出 2。\u003c/p>\n\u003cp>但这段推演还有一个没有解释的地方：wc 怎么知道以后不会再有数据？管道为空可能只是上游暂时还没写，并不代表整个输入已经结束。对普通阻塞管道而言，所有写端引用都关闭，并且缓冲区已经读空之后，read 才返回 0，也就是 EOF。空缓冲区与输入结束是两种不同状态。\u003ca href=\"https://man7.org/linux/man-pages/man7/pipe.7.html\" target=\"_blank\" rel=\"noopener noreferrer\">管道 I/O 语义\u003c/a>\u003c/p>\n\u003cp>这解释了为什么父进程也必须关闭自己继承下来的写端。假如 grep 已经结束，父进程却仍然持有一个写端，内核只能判断“未来仍有人可能写入”。wc 于是继续等待，而父进程又可能正在等待 wc 结束。没有任何数据处理代码出错，却因为一份多余引用，整个计算无法收尾。关闭描述符是通信协议的一部分。\u003c/p>\n\u003cp>再考虑速度差。假设我们的教学模型把缓冲区设为 8 字节，上游每秒产生 10 字节，下游每秒消费 2 字节。每秒净增加 8 字节，缓冲区很快填满。通常的阻塞写入随后等待，下游取走一些字节才会让上游继续。这个等待把下游的处理能力传回了上游。实际管道容量与平台有关，不能把模型中的 8 字节当成系统默认值。\u003c/p>\n\u003cp>因此，有界缓冲区解决的既是存储上限，也是速度协调问题。如果采用无限队列，差额只会变成越来越多的内存占用；如果完全不允许缓冲，又会让两边过度同步。管道选择一个中间状态：允许有限程度的解耦，达到边界后用等待约束生产者。这就是背压的具体含义。\u003c/p>\n\u003cp>这个设计也有明确代价。普通管道只提供字节流，不保证一次 write 对应一次 read。假设发送方连续写入 ABC 和 DEF，接收方可能先读到 AB，再读到 CDEF；双方必须依靠换行、长度字段或其他格式恢复记录边界。内核缓冲区、系统调用和进程调度也有成本。将任务拆成更多程序，可能让复用更方便，也可能增加执行开销。\u003c/p>\n\u003cp>还有一个常见误解需要排除。把 sort 放进管道，并不意味着排序能够一边读一边立即给出最终有序结果。如果还可能读到更小的元素，现在输出的最小值就未必真是全局最小。管道提供连接和传输能力，算法能否提前产出结果，则取决于算法自身的依赖。GNU sort 也提供临时存储相关选项，但这里没有测量 macOS sort 的具体缓冲行为。\u003ca href=\"https://www.gnu.org/software/coreutils/manual/html_node/sort-invocation.html\" target=\"_blank\" rel=\"noopener noreferrer\">GNU sort 文档\u003c/a>\u003c/p>\n\u003cp>以后看到异步数据处理系统，可以沿着同样的顺序追问：组件间传递什么，边界由谁解释，缓冲上限是多少，慢消费者如何约束生产者，关闭或取消又怎样传递？这些问题共同决定“可以连接”能否进一步变成“能够长期正确协作”。\u003c/p>\n\u003cp>读到这里，可以用一个反事实检验理解：如果让 wc 自己还持有管道写端，grep 退出以后，wc 能否确认输入结束？答案是不能，直到那份写端引用也被关闭。能够解释这个等待，而不只记住竖线符号，就已经触及管道的设计核心。\u003c/p>\n\u003cp>本篇在本机执行了四行日志的 grep→wc 管道，输出确认为 2；也单独创建了管道，验证读取完数据后，只要还保留一个复制出来的写端，读端就未到 EOF，关闭最后写端后读取返回空字节。这个实验验证了关键现象，没有测量性能。完整 Shell 的创建进程顺序、错误传播、信号与优化比伪代码更复杂；本篇没有声称追踪了某个 Shell 的全部内部调用。\u003c/p>","minutes":10,"sources":5,"characters":2168,"ordinal":1},{"id":"2026-10-02-virtual-memory","date":"2026-10-02","title":"虚拟内存","subtitle":"怎样用一层映射改变资源的分配方式","topic":"内存管理","source":"02-virtual-memory.md","html":"\u003cp>这篇补上 2026 年 10 月 2 日的内容。延续个人知识库的例子：编辑器正在修改笔记，后台索引程序正在读取文本。我们希望两个程序各自简单地使用内存，同时不能互相破坏；希望资源可以灵活分配，同时不能要求每个程序跟着物理布局不断修改自己的地址。\u003c/p>\n\u003cp>如果程序直接使用物理地址，那么地址就是机器上某一个实际位置。最自然的隔离办法是划分区域：编辑器使用这一段，索引器使用另一段。这个方案并非完全不可行，但程序增长时可能撞到区域边界，空闲空间可能分散在各处，程序里的地址也与具体分配位置绑定。隔离、增长与布局成为一组相互牵制的要求。\u003c/p>\n\u003cp>关键洞察是让程序使用一套自己的地址，再把这些地址翻译成物理地址。编辑器访问 0x1000，索引器也访问 0x1000，两次访问可以落到不同的物理位置。这个地址的意义由进程的映射上下文决定。使用者眼里的连续空间，与机器上实际分散的资源，由此可以分别安排。\u003ca href=\"https://docs.kernel.org/mm/page_tables.html\" target=\"_blank\" rel=\"noopener noreferrer\">Linux 页表文档\u003c/a>\u003c/p>\n\u003cp>为了把映射做成可管理的结构，我们先用一个简化模型：页面大小为 4096 字节，每个进程维护“虚拟页号到物理页号”的映射。以下页大小只是本例假设，不代表所有硬件或所有映射都使用相同页大小。\u003c/p>\n\u003cpre tabindex=\"0\">\u003ccode>虚拟地址 = 虚拟页号 × 4096 + 页内偏移\n物理地址 = 物理页号 × 4096 + 同一个页内偏移\u003c/code>\u003c/pre>\n\u003cp>例如，虚拟地址 0x1234 的虚拟页号是 1，偏移是 0x234。编辑器把虚拟页 1 映射到物理页 9，实际地址就是 0x9234；索引器把虚拟页 1 映射到物理页 20，实际地址就是 0x14234。同一条“向 0x1234 写入”的指令，在两个进程里修改的是不同数据。偏移没有改变，改变的是页的归属。\u003c/p>\n\u003cp>如果你现在把编辑器的下一页映射到物理页 30，程序仍然能沿着连续虚拟地址访问前后两页。它不需要知道物理页 9 和物理页 30 并不相邻。因此，连续性变成提供给程序的接口，物理位置成为内核可以调度的实现选择。\u003c/p>\n\u003cp>映射中还需要权限。例如某页可以读写，另一页只允许读取，还有一页没有合法映射。硬件负责检查翻译与权限。不存在可用映射或违反访问权限时，会触发异常，把控制权交给内核。这里不能把所有缺页异常都理解成非法访问；有些异常恰好是内核预先设计的工作入口。\u003ca href=\"https://docs.kernel.org/mm/page_tables.html#mmu-tlb-and-page-faults\" target=\"_blank\" rel=\"noopener noreferrer\">Linux 关于 MMU、TLB 与缺页异常的说明\u003c/a>\u003c/p>\n\u003cp>我们进一步追一个漂亮的应用：写时复制。假设后台任务通过 fork 获得编辑器进程当时的内存内容。语义要求是，子进程初始看到相同内容，以后双方的私有修改不会干扰对方。最自然的做法是立即复制全部内存。如果进程有 1000 个页面，而子进程最终只改一个页面，其他 999 份复制可能完全没有用到。\u003c/p>\n\u003cp>能不能先共享页面？直接共享可写内存会破坏刚才的语义，因此“共享”还不够。写时复制进一步利用了页表权限：原本可写的页面先由父子共享，但双方的映射暂时去掉写权限，并记住这些页面允许通过 COW 建立私有副本。对于原本就禁止写入的代码页，必须保持原来的禁止写入语义。\u003ca href=\"https://pdos.csail.mit.edu/6.1810/2025/labs/cow.html\" target=\"_blank\" rel=\"noopener noreferrer\">MIT 写时复制实验\u003c/a>\u003c/p>\n\u003cp>用一个页面追完整过程。最初父进程的虚拟页 1 指向物理页 9，内容为 A；子进程的虚拟页 1 也指向物理页 9，引用计数是 2。双方读取都得到 A，没有复制发生。\u003c/p>\n\u003cp>子进程现在想把一个字节改为 B。因为它的映射暂时只读，写指令触发异常。内核确认这是允许处理的 COW 写入，分配物理页 20，把物理页 9 的内容复制过去，然后只修改子进程的映射：虚拟页 1 指向物理页 20，并允许写入。原物理页引用计数降为 1。\u003c/p>\n\u003cp>随后恢复并重试那条写指令。子进程在物理页 20 写入 B，父进程仍从物理页 9 读到 A。对应用来说，它拥有独立的内存；对系统来说，独立的物理副本只在确实需要修改时才产生。页表与异常共同把一个昂贵的预先动作，变成由实际需求触发的动作。\u003ca href=\"https://pdos.csail.mit.edu/6.1810/2025/xv6/book-riscv-rev5.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">MIT《xv6》关于 COW fork 的解释\u003c/a>\u003c/p>\n\u003cp>这个过程要求维护几个不能破坏的关系。写入完成前，写入者必须已经获得符合隔离语义的映射。只要还有进程引用物理页，就不能释放它。曾经只读的代码页不能因为发生写异常就变成可写。修改映射后，还必须按硬件要求处理缓存的旧翻译，否则 CPU 可能继续使用过期映射。把异常处理写通并不足以证明这些关系全部成立。\u003c/p>\n\u003cp>还可以思考一个优化：如果父进程已经退出，物理页 9 只剩子进程引用，那么子进程首次写入时是否仍然要复制？在确认已经独占、原权限允许写入等条件之后，可以直接恢复写权限。复制的必要性来自隔离要求；既然已经没有别的观察者，就没有必要为了形式再造一份副本。\u003c/p>\n\u003cp>代价也因此变得清楚。系统要维护页表、物理页引用与异常处理。地址翻译需要缓存和页表遍历；真正发生首次写入时，异常、分配和复制会带来额外延迟。COW 将工作推迟，也让成本落在具体写入路径上。若最终几乎所有页都被修改，节省就会减少，不能只根据“fork 时很快”判断全生命周期收益。\u003c/p>\n\u003cp>这一讲可以迁移出的思想是：先明确对使用者必须保持的语义，再决定实际资源什么时候需要独立。只读共享、实际修改时分离，也可以作为理解共享缓存与不可变数据的一个观察角度；是否适用，仍取决于谁能够修改以及怎样控制别名。\u003c/p>\n\u003cp>最后用一个反事实检查理解。父子共享页面以后，如果只去掉子进程写权限，父进程仍然可以直接修改原页，会发生什么？子进程会看到父进程的后续修改，初始快照与私有修改隔离就被破坏了。这个失败说明，COW 的关键不是“让子进程晚点复制”，而是控制所有可能修改共享页面的路径。\u003c/p>\n\u003cp>本篇核对了两个地址计算结果，给出的 COW 过程仍是状态推演。没有编译或运行 xv6，也没有声称 Linux 或 macOS 的完整 COW 实现只有这里展示的几个动作。\u003c/p>","minutes":9,"sources":4,"characters":1981,"ordinal":2},{"id":"2026-10-03-wal","date":"2026-10-03","title":"WAL","subtitle":"怎样在随时可能中断的世界里确认一次修改","topic":"数据库","source":"03-wal.md","html":"\u003cp>这篇补上 2026 年 10 月 3 日的内容。个人知识库要保存一篇笔记，事务里同时更新正文与检索索引。我们用简化的两个页面表示它：页面 A 存正文，页面 B 存对应的索引。合法状态只有旧正文配旧索引，或者新正文配新索引；新正文配旧索引是应用不能接受的中间状态。\u003c/p>\n\u003cp>最自然的实现是直接覆盖 A，再覆盖 B。即使没有其他线程，进程也可能恰好在两次写入之间退出。加锁解决的是运行中的相互干扰，机器断电以后，锁不能替你补完第二次写入。这里要处理的是完成一半的持久化动作。\u003c/p>\n\u003cp>可以提出一个看起来更直接的办法：让磁盘把两页同时写完。但页面可能位于不同位置，事务也可能修改更多页，而系统还存在内存缓存、操作系统缓存与存储设备。不能仅靠应用连续调用两次 write，就假定整个修改获得了一个统一的原子边界。\u003c/p>\n\u003cp>WAL 引入的关键洞察是：先把足以支持恢复的信息可靠保存，再允许正式数据页落后于这份记录。这样，应用确认成功所依赖的持久化路径，和后续整理数据页的路径可以分开安排。对使用 WAL 的数据库而言，修改对应的日志必须先于相关数据页持久化；具体日志内容、恢复算法与事务可见性则依实现而异。\u003ca href=\"https://www.postgresql.org/docs/current/wal-intro.html\" target=\"_blank\" rel=\"noopener noreferrer\">PostgreSQL WAL 原理\u003c/a>\u003c/p>\n\u003cp>为了具体说明原子边界，我们接下来只讨论 SQLite 的 WAL 模式。它把修改后的数据库页面追加到 WAL 文件，而不是在事务提交过程中直接覆盖主数据库的旧页面。WAL 有提交边界，读取要选择属于有效提交范围的页面。以下数字是教学模型，省略真实文件头、校验与锁协议。\u003c/p>\n\u003cp>假设主数据库仍然保存 A0 与 B0。事务生成 A1 与 B1，并准备把它们记入日志。用逻辑记号表示过程：\u003c/p>\n\u003cpre tabindex=\"0\">\u003ccode>主数据库：A0，B0\n日志追加：A1\n日志追加：B1，事务提交边界\u003c/code>\u003c/pre>\n\u003cp>现在看三个中断位置。如果在追加之前退出，当然只能看到旧版本。如果 A1 已经写入，但事务提交边界尚未成立，这些尾部内容不能作为一个完整的新事务向读者发布。如果新版本的有效提交已经可靠保存，即使主文件仍是 A0、B0，数据库也能通过主文件与 WAL 的组合提供 A1、B1。关键是识别有效事务边界，而不是把日志里出现过的所有字节都当成正式状态。\u003ca href=\"https://www.sqlite.org/walformat.html\" target=\"_blank\" rel=\"noopener noreferrer\">SQLite WAL 文件格式\u003c/a>\u003c/p>\n\u003cp>这时容易产生疑问：如果数据页没有写回主文件，读取为什么还能正确？因为数据库的逻辑状态不必等同于一个文件当时的内容。WAL 模式下，读事务记住自己开始时可见的日志结束位置。要读某页，先在这个范围以内寻找它的最近版本，找不到才读主文件。\u003ca href=\"https://www.sqlite.org/wal.html#concurrency\" target=\"_blank\" rel=\"noopener noreferrer\">SQLite WAL 的读者算法\u003c/a>\u003c/p>\n\u003cp>把读者也放进例子。读者 R 在新事务提交之前开始，记住旧的可见边界。写者随后提交 A1、B1，新的读者 N 可以读取新版本，但 R 仍沿着旧边界读取 A0、B0。只要 R 的事务还没结束，它就不必在查询一半时突然换到另一个版本。SQLite 用这种方式提供 WAL 模式下的快照隔离。\u003ca href=\"https://www.sqlite.org/isolation.html\" target=\"_blank\" rel=\"noopener noreferrer\">SQLite 隔离说明\u003c/a>\u003c/p>\n\u003cp>这里有两个不同问题：提交是否形成一组可见的修改，以及这些修改在何种故障之后还能保留。前者涉及原子性与读取规则；后者涉及持久化顺序和同步策略。不能因为调用了 COMMIT，就在任何配置下都声称已经获得相同的掉电保证。\u003c/p>\n\u003cp>例如，SQLite 在 WAL 模式下采用 synchronous=FULL 时，会在每次事务提交后同步 WAL；NORMAL 会减少同步，但某些已经提交的事务可能在掉电或操作系统崩溃后丢失。讨论“已提交不会丢”时，必须把同步配置和底层存储保证带进结论。进程退出、操作系统崩溃和机器断电，也不是同一个故障模型。\u003ca href=\"https://www.sqlite.org/pragma.html#pragma_synchronous\" target=\"_blank\" rel=\"noopener noreferrer\">SQLite synchronous 文档\u003c/a>\u003c/p>\n\u003cp>再问一个问题：既然读写都能依靠 WAL，为什么还要检查点？因为日志不应无限增长。检查点把已经合适写回的页面搬回主数据库，使旧日志最终有机会被复用。但它不能把一个旧读者还需要的视图破坏掉。一个持续很久的读事务，可能让检查点不能推进到最新位置。这是快照稳定性换来的维护成本。\u003c/p>\n\u003cp>所以 WAL 的代价不只是“多写一份日志”。系统增加了第三类动作——检查点，需要协调它与读者、写者的关系。页可能先写入日志，再写回主文件，形成额外 I/O；同步操作影响提交延迟；长读事务影响回收；SQLite 还需要共享 WAL 索引，并仍然限制同一时刻只有一个写者。读取稳定性与存储回收之间存在真实矛盾。\u003c/p>\n\u003cp>可以用反事实检查这个设计。如果系统在日志尚未可靠保存时，就把新页面覆盖到主文件，然后断电，恢复会缺少什么？可能缺少解释或修复已经覆盖内容所需的信息。先写日志这一顺序约束，正是为了避免正式状态走到了恢复依据前面。\u003c/p>\n\u003cp>再把这个设计放回软件工程。你实现一个可恢复工作流时，需要先定义哪些信息足以重建进度，再决定什么时候可以对外确认完成。只打印“开始保存”并不足够；日志必须有稳定格式、边界、存储保证与恢复解释器。WAL 的漂亮之处，在于把恢复从事后猜测，变成正常写入协议的一部分。\u003c/p>\n\u003cp>事件溯源可以从相近角度理解：保留事件，使状态能够通过规则重建。不过，它记录的可能是业务事件；SQLite WAL 记录的是页面版本。两者在记录粒度、重放规则和事务语义上并不相同。设计思想可以迁移，具体正确性证明不能直接搬过去。\u003c/p>\n\u003cp>阅读完成以后，试着解释这个状态：主数据库还没有新正文，但保存 API 已经成功返回，新的查询也能读到新正文。它未必矛盾，因为读者的正式视图可能来自主文件与已提交 WAL 的组合。接着必须追问同步配置，才能判断机器断电后是否仍保证保留。\u003c/p>\n\u003cp>本篇在本机 SQLite WAL 模式下运行了双连接更新与快照读取：写者提交 A1、B1 后，已开启事务的旧读者仍读到 A0、B0，新连接读到 A1、B1。这个实验验证了快照行为，没有模拟进程崩溃或真实断电。页面序列仍是教学模型，也没有把 PostgreSQL 与 SQLite 的恢复实现混为一套算法。两个页面代表事务修改的关系，并非声称某个具体 SQL 语句只触碰两个页面。\u003c/p>","minutes":9,"sources":5,"characters":2011,"ordinal":3},{"id":"2026-10-04-git-objects","date":"2026-10-04","title":"Git 对象与引用","subtitle":"怎样让完整版本共享同一份未变化内容","topic":"版本控制","source":"04-git-objects.md","html":"\u003cp>这篇补上 2026 年 10 月 4 日的内容。知识库现在有一百篇笔记，你每天只修改其中几篇，却希望能够恢复任意一个已经提交的版本。保存完整目录最容易理解，但如果每个版本都复制所有文件，大量未变化内容会被反复存储。\u003c/p>\n\u003cp>另一种自然的想法是只保存差异：版本二记住对版本一改了什么，版本三记住对版本二改了什么。这样可能节省空间，但如果把历史语义完全定义成一条补丁链，恢复某版本就要沿着依赖关系解释这些变化。我们希望既有完整快照的清楚语义，又不必每次复制完整内容。\u003c/p>\n\u003cp>Git 的对象模型通过内容寻址和引用共享解决这组矛盾。对象标识由对象类型、长度与内容等信息参与计算；一份 blob 对象保存文件内容，文件名并不在 blob 内。tree 对象记录名字、模式和对应的 blob 或子 tree，commit 对象再指向根 tree，并记录父提交和提交信息。\u003ca href=\"https://git-scm.com/book/en/v2/Git-Internals-Git-Objects\" target=\"_blank\" rel=\"noopener noreferrer\">Git Objects 官方教材\u003c/a>\u003c/p>\n\u003cp>这里有一个很值得停下来理解的分离。文件名回答“这份内容在这个目录里叫什么”，内容标识回答“这到底是哪份内容”。名字相同，内容可以不同；名字不同，内容也可以相同。身份与位置不再绑在一起，因此不同版本可以共享未变化的对象。\u003c/p>\n\u003cp>为了避免一下引入一百篇笔记，我们先只保留两篇：\u003c/p>\n\u003cpre tabindex=\"0\">\u003ccode>notes/\n    memory.md  内容为 M0\n    network.md 内容为 N0\u003c/code>\u003c/pre>\n\u003cp>第一次提交 C0 的根 tree 引用 notes 的目录 tree；这个目录 tree 的两条记录分别指向 blob(M0) 与 blob(N0)。C0 又记录自己的作者、提交者、说明等信息。用括号中的文字表示内容对象，省略具体哈希值，能够先把注意力放在关系上。\u003c/p>\n\u003cp>现在只把 memory.md 改成 M1。Git 写出新的 blob(M1)，新的 notes tree 把 memory.md 指向它，但 network.md 仍指向原来的 blob(N0)。根目录的引用关系发生变化，也需要新的根 tree。新提交 C1 指向这个新根，同时把 C0 记录为父提交。\u003c/p>\n\u003cp>因此，修改沿着“变更文件到根目录”的路径产生新对象，而没有变化的内容可以继续共享。C1 表达完整版本，因为从它的根 tree 能找到该版本的全部文件；它也没有重新保存 N0，因为那份内容已经存在。完整的版本语义与内容复用可以同时成立。\u003c/p>\n\u003cp>这个推演还能解释目录层次的意义。如果改的是 notes/system/memory.md，发生变化的不只有 blob，还包括引用它的 system tree、引用 system 的 notes tree，以及更上层受影响的 tree。变化沿着引用关系向上影响对象标识。我们可以把它理解成一张由内容决定标识的对象图，而不必把“一个提交”想象成一个打包全部文件的新目录。\u003c/p>\n\u003cp>接下来创建一个名为 experiment 的分支。它不需要复制 C0、C1 或它们引用的文件对象；分支引用只要指向 C1 就足够。后续在这个分支生成 C2，再让 experiment 指向 C2。main 仍然可以指向 C1。稳定对象与可移动名字承担不同职责。\u003ca href=\"https://git-scm.com/book/en/v2/Git-Internals-Git-References\" target=\"_blank\" rel=\"noopener noreferrer\">Git References 官方教材\u003c/a>\u003c/p>\n\u003cp>由此也能理解一个容易困惑的现象：两个提交拥有完全相同的文件树，提交标识仍然可能不同。因为 commit 对象不只有文件树，还包含父关系与提交元数据。文件内容相同不等于历史事件相同。相反，多个提交引用同一个 blob，则可以精确表达它们共享那份文件内容。\u003c/p>\n\u003cp>这里要避免另一个常见说法：“Git 保存快照，所以从来不保存差异。”快照描述的是逻辑对象关系，物理存储又有自己的优化层。Git 的 packfile 可以用对象间的差量压缩保存数据，取出对象时再重建。对象模型保持不变，不意味着磁盘必须为每个对象始终保存一份独立、完整的原始字节文件。\u003ca href=\"https://git-scm.com/book/en/v2/Git-Internals-Packfiles\" target=\"_blank\" rel=\"noopener noreferrer\">Git Packfiles 官方教材\u003c/a>\u003c/p>\n\u003cp>所以你可以把这个系统理解成两份契约。上层对使用者承诺：某个提交描述一个可以解析的版本及其历史关系。下层负责：怎样压缩、组织和读取对象，才能减少空间和 I/O。它们有联系，但把它们混在一起，会很难解释为什么对象能被重新打包却保持同一个标识。\u003c/p>\n\u003cp>再看代价。不可变对象方便共享和比较，却也意味着旧对象不会因为新版本出现就自动消失。系统要判断对象是否仍被引用，并维护存储。内容寻址的可靠性依赖所采用的哈希与完整性处理，不能把标识相等当成脱离威胁模型的数学保证。压缩对象还可能增加读取时的重建工作。\u003c/p>\n\u003cp>更实际的限制是，它不能替你判断两段文字是否表达同一件事。哪怕两个文件含义相同，只要对象字节不同，标识也可能不同；两个分支改了相互冲突的内容，哈希只能准确指出对象，无法替人决定哪种业务语义正确。数据身份问题与语义合并问题被分别处理。\u003c/p>\n\u003cp>这个设计可以迁移到内容缓存与去重存储。对于不再原地修改的数据，用内容标识让多处引用共享同一份对象；把“当前使用哪个版本”放到较小、可更新的引用中。不过，一旦对象背后还存在可变外部资源，例如某个随时变化的 URL，就不能仅凭保存 URL 的对象来宣称外部内容也被冻结了。\u003c/p>\n\u003cp>最后做一个反事实推演：如果修改了 blob 的原始内容，却让旧标识保持不变，会破坏什么？旧提交通过这个标识读到的内容会改变，历史不再稳定，标识也不再能代表相应内容。Git 的对象模型要求变化形成新的对象身份，而历史引用继续解释原来的对象。\u003c/p>\n\u003cp>这就是这篇要理解的核心关系：内容对象保持稳定，目录对象安排名字，提交对象安排历史，分支引用安排当前入口。只有把四种职责各自追清楚，才能从原理解释版本共享与分支成本。\u003c/p>\n\u003cp>本篇在独立的临时 Git 仓库创建了两个文件与两次提交，确认改动文件的 blob 标识变化、未改文件的 blob 标识保持一致；新建分支也确实指向已有提交。正文的 M0、N0、C0 等记号仍是教学命名。具体对象数量与压缩布局取决于目录结构、已有对象及存储维护；本篇没有声称测量大型仓库的空间收益。\u003c/p>","minutes":9,"sources":3,"characters":1919,"ordinal":4},{"id":"2026-10-05-tcp-window","date":"2026-10-05","title":"TCP 滑动窗口","subtitle":"怎样把等待变成可控的并行","topic":"网络","source":"05-tcp-window.md","html":"\u003cp>这篇补上 2026 年 10 月 5 日的内容。知识库需要把一批笔记传到另一台机器。网络有传播延迟，还可能丢包、重复或乱序。我们需要一个既能可靠传输，又不会让发送方在每次网络往返里都闲等的设计。\u003c/p>\n\u003cp>最直观的可靠办法是停等：发送一段，等收到确认，再发送下一段。假设每段有效数据为 1000 字节，往返时间为 0.1 秒，忽略序列化时间、处理开销和丢包，那么每秒只能完成大约 10 次等待，吞吐约为 10000 字节每秒。即使链路很快，这套发送规则也可能让链路大量时间空闲。\u003c/p>\n\u003cp>能不能一次把全部笔记发出去？这又需要承担无限数量的未确认数据，接收端缓冲区可能被塞满，网络也可能被过量流量压垮。矛盾因此变得清楚：等待过于保守，完全不等待又缺少资源约束。\u003c/p>\n\u003cp>滑动窗口在两者之间建立了一个有界的未完成范围。发送方允许多个字节区间同时等待确认，收到反馈以后回收已完成区间，释放新的发送额度。TCP 的序号针对字节，累计确认表示下一个期望收到的序号。下面忽略序号回绕、连接建立和关闭时的序号消耗，只讨论已建立连接的数据传输。\u003ca href=\"https://www.rfc-editor.org/rfc/rfc9293.html\" target=\"_blank\" rel=\"noopener noreferrer\">TCP 标准 RFC 9293\u003c/a>\u003c/p>\n\u003cp>先用一个没有丢包的例子。最早未确认字节是 1000，接下来待发送字节也是 1000，可用窗口为 4000 字节。发送方可以发送序号从 1000 到 4999 的数据，而不必每发一段就等一次。假设它先发出三段：1000—1999、2000—2999、3000—3999。\u003c/p>\n\u003cp>此时最早未确认位置仍是 1000，下一个待发送位置已是 4000，尚未确认的数据量为 3000 字节。窗口里还剩 1000 字节额度。如果接收端确认到 2000，意味着此前连续的数据已被接收；最早未确认位置移动到 2000。发送方就能回收那一千字节的等待状态，让新的数据进入允许发送的范围。这就是窗口“滑动”的实际含义。\u003c/p>\n\u003cp>为了看清为什么不能只用一个“发了多少包”的计数器，我们给中间一段制造丢失。第一段到达，第二段丢失，第三段到达。接收端已经拥有 1000—1999 和 3000—3999，但连续前缀只到 1999，累计确认仍然指向 2000。它不能确认到 4000，否则发送方可能误以为缺失的那段也已经安全收到。\u003c/p>\n\u003cp>这个状态说明可靠性依赖一个不变量：累计确认的前沿只能跨过已经连续收到的字节。后面收到的内容可以先缓存，但前面缺失的数据仍然需要补齐。第二段重传到达后，缺口消失，连续前缀才能推进到 3999，确认随之到 4000。\u003c/p>\n\u003cp>如果确认本身丢失，发送方可能再次发送已经到达的字节。序号让接收端能够识别这些字节对应同一个区间，而不是把重复传输误当成新的数据。序号与确认共同把“发送方是否知道完成”和“接收方实际收到什么”这两种状态连接起来，但它们不可能在每个时刻都完全同步。\u003c/p>\n\u003cp>超时又是另一个设计问题。假如发送方固定等待很短的时间，正常网络延迟也可能被误判成丢包，造成大量无谓重传；固定得很长，真正丢包时又会恢复缓慢。TCP 的重传超时计算会利用往返时间估计与变化，并在连续超时时退避。这不是本篇要展开的完整算法，但它说明反馈本身也需要面对不确定性。\u003ca href=\"https://www.rfc-editor.org/rfc/rfc6298.html\" target=\"_blank\" rel=\"noopener noreferrer\">重传计时器 RFC 6298\u003c/a>\u003c/p>\n\u003cp>接下来问最关键的资源问题：这个窗口应该由谁决定？接收窗口反映接收端能够接纳的范围；拥塞窗口反映发送方依据网络反馈所允许的在途数据量。经典 TCP 的发送受两者共同约束。接收端有空闲内存，不代表网络还有空闲承载能力；网络畅通，也不代表接收端应用正在及时消费。\u003ca href=\"https://www.rfc-editor.org/rfc/rfc5681.html\" target=\"_blank\" rel=\"noopener noreferrer\">TCP 拥塞控制 RFC 5681\u003c/a>\u003c/p>\n\u003cp>在一个稳定、持续发送、无丢包的简化模型里，可把窗口约束下的吞吐近似写成：\u003c/p>\n\u003cpre tabindex=\"0\">\u003ccode>吞吐 ≤ 有效窗口 / RTT\u003c/code>\u003c/pre>\n\u003cp>如果 RTT 为 0.1 秒，有效窗口为 100000 字节，得到的窗口约束是约每秒 1000000 字节。它是一个上限条件，真实吞吐还可能被链路带宽、丢包、协议开销、发送节奏、CPU 与应用限制。这个公式不能替代实际测量。\u003c/p>\n\u003cp>反过来看，假设链路目标吞吐为每秒 25000000 字节，RTT 仍为 0.1 秒，为了持续填充这条链路，需要容纳的在途数据量约为 2500000 字节。这就是带宽与往返时间相乘得到的尺度。链路越快、往返越久，就越需要足够多的工作同时在途，才能覆盖等待时间。\u003c/p>\n\u003cp>代价由此直接出现。发送方保存未确认数据以便重传，接收方可能缓存乱序数据，双方维护窗口、序号和计时器。窗口太小浪费可用带宽，窗口过大也可能增加排队与内存压力。并且 TCP 提供有序字节流，某个前部缺口可能延迟后部已经到达的数据向应用交付；可靠顺序本身带来等待关系。\u003c/p>\n\u003cp>这里还要区分三层完成。send 返回成功通常说明数据已被本机发送路径接受，并不证明远端收到。TCP 确认说明相应字节到达了远端 TCP 层，也不证明远端应用已经把笔记可靠保存。要表达“笔记已保存”，仍需应用协议里的确认，以及相应的持久化语义。把传输确认当成业务完成，会把错误的承诺交给用户。\u003c/p>\n\u003cp>这一讲和管道的联系，现在可以精确说出来：两者都使用有限容量协调生产与消费，但 TCP 的反馈需要跨网络传播，因此在反馈到来之前必须允许一批工作继续进行。它把一个漫长的等待周期，转换成有界的在途状态。\u003c/p>\n\u003cp>在异步任务系统里，也可以借用这种结构：允许最多一批任务尚未完成，完成一个就回收一个名额。迁移时仍须重新定义“完成”——拿到任务、完成计算、保存结果、向用户交付，各自不是同一个边界。窗口控制资源，完成协议定义语义，两者都需要。\u003c/p>\n\u003cp>最后检验一个反事实。收到第三段时，假如接收端直接确认到 4000，后来第二段一直没有补到，会发生什么？发送方可能不再保留或重传第二段，而应用又缺少该区间的数据。累计确认不能跳过缺口，并非保守偏好，而是它所表达的承诺必须成立。\u003c/p>\n\u003cp>本篇核对了停等吞吐、窗口约束与在途数据量的算术结果，只推演序号、累计确认与窗口约束，没有进行抓包或网络吞吐测试。真实 TCP 还包含选择性确认、不同拥塞算法、发送节奏与更多边界处理；这里的数值是教学假设，不是设备基准结果。\u003c/p>","minutes":9,"sources":3,"characters":2022,"ordinal":5}]}</script>
<script>
'use strict';
const dataset = JSON.parse(document.getElementById('lesson-data').textContent);
const lessons = dataset.lessons;
const byId = new Map(lessons.map(lesson => [lesson.id, lesson]));
const latest = lessons[lessons.length - 1];
const escapeText = text => String(text).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const formatDate = date => date.replaceAll('-', '.');
const number = n => String(n).padStart(2, '0');
document.getElementById('archive-count').textContent = `${lessons.length} 讲`;
document.getElementById('collection-meta').textContent = `收录 ${lessons.length} 讲 · 更新至 ${formatDate(latest.date)}`;
document.getElementById('brand-link').href = `#${latest.id}`;
document.getElementById('latest-link').href = `#${latest.id}`;
document.getElementById('lesson-list').innerHTML = [...lessons].reverse().map(lesson => `<li><a class="lesson-link" href="#${lesson.id}" data-lesson="${lesson.id}"><time class="lesson-date" datetime="${lesson.date}">${formatDate(lesson.date)} / ${number(lesson.ordinal)}</time><span class="lesson-name">${escapeText(lesson.title)}</span><span class="lesson-topic">${escapeText(lesson.topic)}</span></a></li>`).join('');
document.getElementById('lesson-select').innerHTML = [...lessons].reverse().map(lesson => `<option value="${lesson.id}">${formatDate(lesson.date)} · ${escapeText(lesson.title)}</option>`).join('');
let currentId = null;
function render(scrollToStart) {
  let requested;
  try { requested = decodeURIComponent(location.hash.slice(1)); } catch { requested = ''; }
  const lesson = byId.get(requested) || latest;
  if (currentId === lesson.id) return;
  currentId = lesson.id;
  document.title = `${lesson.title} · 一日一设计`;
  document.getElementById('article-title').textContent = lesson.title;
  document.getElementById('article-subtitle').textContent = lesson.subtitle;
  document.getElementById('eyebrow').textContent = `第 ${number(lesson.ordinal)} 讲 / ${lesson.topic}`;
  document.getElementById('article-meta').innerHTML = `<time datetime="${lesson.date}">${formatDate(lesson.date)}</time><span>约 ${lesson.minutes} 分钟阅读</span><span>${lesson.sources} 处来源</span>`;
  document.getElementById('article-body').innerHTML = lesson.html;
  for (const link of document.querySelectorAll('[data-lesson]')) {
    if (link.dataset.lesson === lesson.id) link.setAttribute('aria-current', 'page');
    else link.removeAttribute('aria-current');
  }
  document.getElementById('lesson-select').value = lesson.id;
  const index = lessons.findIndex(item => item.id === lesson.id);
  const previous = lessons[index - 1], next = lessons[index + 1];
  document.getElementById('reading-nav').innerHTML = `${previous ? `<a href="#${previous.id}"><small>前一讲 · ${formatDate(previous.date)}</small><span>${escapeText(previous.title)}</span></a>` : ''}${next ? `<a class="next" href="#${next.id}"><small>后一讲 · ${formatDate(next.date)}</small><span>${escapeText(next.title)}</span></a>` : ''}`;
  if (scrollToStart) {
    document.getElementById('reader').focus({preventScroll:true});
    window.scrollTo({top:0,behavior:'instant'});
  }
}
document.getElementById('lesson-select').addEventListener('change', event => { location.hash = event.target.value; });
window.addEventListener('hashchange', () => render(true));
render(false);
</script>
</body>
